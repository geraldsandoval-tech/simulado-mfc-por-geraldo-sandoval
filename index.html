<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Revisão interativa — Medicina de Família e Comunidade</title>
<style>
  :root {
    --bg: #0A0D12;
    --surface: #121620;
    --surface-2: #1A2029;
    --surface-3: #212938;
    --border: #262E3A;
    --border-soft: #1D2430;
    --text: #EDF1F5;
    --text-muted: #8D97A5;
    --text-faint: #5B6472;
    --accent: #E7B948;
    --accent-soft: rgba(231, 185, 72, 0.14);
    --accent-ink: #1A1406;
    --correct: #3DDC97;
    --correct-bg: rgba(61, 220, 151, 0.12);
    --correct-border: rgba(61, 220, 151, 0.45);
    --incorrect: #F2647A;
    --incorrect-bg: rgba(242, 100, 122, 0.12);
    --incorrect-border: rgba(242, 100, 122, 0.45);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, ui-sans-serif, system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg);
  }

  body {
    font-family: var(--font-ui);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    min-height: 100%;
  }

  #app {
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  button {
    font-family: inherit;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  ::selection { background: var(--accent-soft); color: var(--text); }

  a { color: var(--accent); }

  /* ---------- shared layout bits ---------- */

  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 28px 22px calc(28px + var(--safe-bottom));
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: none;
    border-radius: var(--radius-md);
    padding: 17px 24px;
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.15s ease, background-color 0.15s ease;
    min-height: 54px;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
    text-transform: uppercase;
    width: 100%;
  }
  .btn-primary:not(:disabled):hover { background: #EFC562; }

  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    width: 100%;
  }
  .btn-ghost:not(:disabled):hover { border-color: var(--text-faint); color: var(--text); }

  .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .link-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 13px;
    padding: 8px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .link-btn:hover { color: var(--text-muted); }

  /* ---------- start screen ---------- */

  .start-screen {
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 0;
  }

  .start-mark {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 28px;
  }

  .start-title {
    font-size: 34px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 14px;
    text-transform: uppercase;
  }

  .start-subtitle {
    font-size: 16px;
    color: var(--text-muted);
    line-height: 1.5;
    margin: 0 0 36px;
    max-width: 380px;
  }

  .start-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 36px;
  }

  .start-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 10px;
  }

  .start-stat-num {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .start-stat-label {
    font-size: 11.5px;
    color: var(--text-faint);
    margin-top: 4px;
    line-height: 1.3;
  }

  .start-actions {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .resume-banner {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-bottom: 18px;
    text-align: left;
    font-size: 13.5px;
    color: var(--text-muted);
  }
  .resume-banner strong { color: var(--text); }

  /* ---------- quiz header ---------- */

  .quiz-header {
    padding: 16px 22px 14px;
    border-bottom: 1px solid var(--border-soft);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }

  .quiz-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .quiz-counter {
    font-family: var(--font-mono);
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }

  .quiz-counter b { color: var(--text); font-weight: 600; }

  .quiz-percent {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }

  .progress-track {
    height: 6px;
    border-radius: 4px;
    background: var(--surface-2);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .exit-link {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 12.5px;
    cursor: pointer;
    padding: 4px 6px;
  }
  .exit-link:hover { color: var(--text-muted); }

  /* ---------- question body ---------- */

  .quiz-body {
    padding: 22px 22px 110px;
    flex: 1;
  }

  .tema-chip {
    display: inline-block;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 13px;
    border-radius: 100px;
    margin-bottom: 16px;
  }

  .enunciado {
    font-size: 17px;
    line-height: 1.62;
    color: var(--text);
    margin: 0 0 24px;
    white-space: pre-line;
  }

  .alt-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 8px;
  }

  .alt-row {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    text-align: left;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 15px 16px;
    cursor: pointer;
    transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.1s ease;
    width: 100%;
  }
  .alt-row:active:not(.locked) { transform: scale(0.985); }
  .alt-row:not(.locked):hover { border-color: var(--text-faint); }

  .alt-badge {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 9px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .alt-text {
    font-size: 16px;
    line-height: 1.5;
    font-weight: 500;
    color: var(--text);
    padding-top: 3px;
  }

  .alt-row.correct-row {
    background: var(--correct-bg);
    border-color: var(--correct-border);
  }
  .alt-row.correct-row .alt-badge {
    background: var(--correct);
    border-color: var(--correct);
    color: #06231A;
  }

  .alt-row.incorrect-row {
    background: var(--incorrect-bg);
    border-color: var(--incorrect-border);
  }
  .alt-row.incorrect-row .alt-badge {
    background: var(--incorrect);
    border-color: var(--incorrect);
    color: #2B0810;
  }

  .alt-row.locked { cursor: default; }
  .alt-row.locked.dim { opacity: 0.45; }

  .alt-mark {
    margin-left: auto;
    font-size: 17px;
    padding-left: 8px;
    flex-shrink: 0;
  }

  /* ---------- feedback + explanation ---------- */

  .feedback-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 700;
    margin: 20px 0 4px;
    animation: feedback-in 0.28s ease;
  }
  .feedback-banner.is-correct {
    background: var(--correct-bg);
    color: var(--correct);
    border: 1px solid var(--correct-border);
  }
  .feedback-banner.is-incorrect {
    background: var(--incorrect-bg);
    color: var(--incorrect);
    border: 1px solid var(--incorrect-border);
  }

  @keyframes feedback-in {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .explain-panel {
    margin-top: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px 20px;
    animation: panel-in 0.3s ease;
  }

  @keyframes panel-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .explain-block { margin-bottom: 20px; }
  .explain-block:last-child { margin-bottom: 0; }

  .explain-label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    margin: 0 0 8px;
  }

  .explain-text {
    font-size: 15px;
    line-height: 1.62;
    color: var(--text-muted);
    margin: 0;
  }

  .explain-gabarito {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--correct-bg);
    border: 1px solid var(--correct-border);
    color: var(--correct);
    font-size: 14.5px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 100px;
  }

  .wrong-alt-item {
    padding: 12px 0;
    border-top: 1px solid var(--border-soft);
  }
  .wrong-alt-item:first-child { border-top: none; padding-top: 4px; }

  .wrong-alt-letter {
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--incorrect);
    margin-right: 6px;
  }

  /* ---------- bottom nav ---------- */

  .quiz-nav {
    position: sticky;
    bottom: 0;
    display: flex;
    gap: 12px;
    padding: 14px 22px calc(14px + var(--safe-bottom));
    background: linear-gradient(180deg, rgba(10,13,18,0) 0%, var(--bg) 30%);
    border-top: 1px solid var(--border-soft);
  }

  .quiz-nav .btn { flex: 1; min-height: 50px; padding: 14px; }

  /* ---------- result screen ---------- */

  .result-screen { justify-content: flex-start; padding-top: 44px; }

  .result-hero { text-align: center; margin-bottom: 30px; }

  .result-percent {
    font-family: var(--font-mono);
    font-size: 72px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .result-band {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin-top: 10px;
  }

  .result-band-desc {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 6px;
    max-width: 340px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.5;
  }

  .result-track {
    height: 8px;
    border-radius: 5px;
    background: var(--surface-2);
    overflow: hidden;
    margin: 26px 0 22px;
  }
  .result-track-fill {
    height: 100%;
    border-radius: 5px;
    background: var(--accent);
    transition: width 0.6s cubic-bezier(0.22,1,0.36,1);
  }

  .result-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 30px;
  }

  .result-stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 18px;
    text-align: center;
  }
  .result-stat-card.acertos { border-color: var(--correct-border); background: var(--correct-bg); }
  .result-stat-card.erros { border-color: var(--incorrect-border); background: var(--incorrect-bg); }

  .result-stat-num {
    font-family: var(--font-mono);
    font-size: 30px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .result-stat-card.acertos .result-stat-num { color: var(--correct); }
  .result-stat-card.erros .result-stat-num { color: var(--incorrect); }

  .result-stat-label {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .review-tema-note {
    font-size: 13px;
    color: var(--text-faint);
    text-align: center;
    margin-top: 22px;
    line-height: 1.5;
  }

  .review-flag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    padding: 3px 9px;
    border-radius: 100px;
    margin-bottom: 14px;
  }

  @media (max-width: 380px) {
    .start-title { font-size: 28px; }
    .result-percent { font-size: 60px; }
    .screen { padding-left: 18px; padding-right: 18px; }
    .quiz-header { padding-left: 18px; padding-right: 18px; }
    .quiz-body { padding-left: 18px; padding-right: 18px; }
    .quiz-nav { padding-left: 18px; padding-right: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  button:focus-visible, .alt-row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

var QUESTIONS = [{"id": 1, "tema": "APS — Primeiro contato e porta de entrada", "enunciado": "Um homem de 34 anos procura pela primeira vez a UBS de seu bairro, sem vínculo prévio com a equipe, referindo dor abdominal há dois dias. Antes de decidir qualquer encaminhamento, a equipe realiza acolhimento, escuta a queixa e avalia a necessidade clínica ali mesmo, orientando os próximos passos.", "alternativas": {"A": "Primeiro contato (porta de entrada), pois a UBS acolhe a necessidade do usuário já no primeiro acesso ao sistema", "B": "Longitudinalidade, pois a equipe já conhece a história de vida do paciente", "C": "Coordenação do cuidado, pois a equipe está organizando o fluxo entre diferentes serviços", "D": "Territorialização, pois o paciente mora na área de abrangência da unidade"}, "correta": "A", "raciocinio": "O enunciado descreve um paciente sem vínculo prévio, buscando a unidade pela primeira vez. O elemento central a identificar é qual atributo da APS está sendo exercido nesse momento específico: o acolhimento e a avaliação da necessidade no primeiro acesso ao sistema, e não o histórico de acompanhamento (que exigiria vínculo já construído) nem a integração entre serviços (que pressupõe encaminhamento em curso).", "porque_correta": "Primeiro contato (também chamado de acesso ou porta de entrada) é o atributo que garante que a pessoa seja acolhida e tenha sua necessidade avaliada no momento em que busca o sistema de saúde, independentemente de vínculo prévio. É exatamente o que a UBS faz nesse caso.", "erros": {"B": "Incorreta porque longitudinalidade pressupõe uma relação continuada ao longo do tempo, com conhecimento acumulado da história da pessoa — o que não está presente aqui, já que o paciente não tem vínculo prévio com a equipe.", "C": "Incorreta porque coordenação do cuidado refere-se à integração de informações e ao acompanhamento do percurso do paciente entre diferentes pontos de atenção (por exemplo, entre a UBS e um especialista), algo que ainda não ocorreu nesse primeiro atendimento.", "D": "Incorreta porque territorialização diz respeito ao processo de conhecer e organizar o cuidado a partir das características do território, e não ao ato pontual de acolher um paciente que busca a unidade pela primeira vez."}}, {"id": 2, "tema": "APS — Longitudinalidade", "enunciado": "Uma mulher de 58 anos, hipertensa, é acompanhada pela mesma equipe de Saúde da Família há oito anos. Nas consultas, o médico já conhece sua história de reações medicamentosas prévias, sua rotina familiar e suas dificuldades de adesão, o que permite ajustar o tratamento com mais segurança. Esse cuidado exemplifica principalmente qual atributo da APS?", "alternativas": {"A": "Integralidade, pela oferta de todos os níveis de atenção", "B": "Longitudinalidade, pela relação continuada e pelo vínculo construído ao longo do tempo", "C": "Primeiro contato, pela facilidade de acesso à unidade", "D": "Ação intersetorial, pela articulação com outros setores"}, "correta": "B", "raciocinio": "O dado central do enunciado é o tempo de acompanhamento (oito anos) pela mesma equipe e o acúmulo de conhecimento sobre a história pessoal da paciente. Isso deve ser diferenciado de integralidade (que trata da amplitude das ações oferecidas) e de primeiro contato (que trata do acesso inicial ao sistema).", "porque_correta": "Longitudinalidade é o atributo que se refere à relação continuada entre profissional/equipe e paciente ao longo do tempo, com vínculo e conhecimento acumulado da história da pessoa — exatamente o que permite o ajuste seguro do tratamento descrito no caso.", "erros": {"A": "Incorreta porque integralidade refere-se à amplitude das ações oferecidas (promoção, prevenção, tratamento, reabilitação, cuidados paliativos), e não ao fato de o vínculo ser antigo e continuado — o caso não menciona diversidade de ações, mas sim tempo de acompanhamento.", "C": "Incorreta porque primeiro contato refere-se ao momento de acesso inicial ao sistema de saúde, e o caso descreve justamente o oposto: um vínculo já consolidado ao longo de vários anos, não um primeiro acesso.", "D": "Incorreta porque ação intersetorial envolve articulação com setores fora da saúde (educação, assistência social, etc.), o que não é mencionado no caso, que se restringe ao vínculo clínico entre paciente e equipe."}}, {"id": 3, "tema": "APS — Coordenação do cuidado", "enunciado": "Um paciente encaminhado ao cardiologista retorna à UBS com uma nova receita, mas sem relatório detalhado. A equipe da APS entra em contato com o especialista, integra a nova prescrição ao prontuário e verifica possíveis interações com os medicamentos que o paciente já utilizava. Essa conduta ilustra principalmente qual atributo da APS?", "alternativas": {"A": "Acesso oportuno, pois o paciente foi atendido rapidamente", "B": "Territorialização, pois a UBS está localizada próxima ao paciente", "C": "Coordenação do cuidado, ao integrar informações e acompanhar o percurso entre diferentes serviços", "D": "Equidade, pois todos os pacientes recebem o mesmo tipo de acompanhamento"}, "correta": "C", "raciocinio": "O elemento-chave é a ação da equipe de buscar informações junto ao especialista e integrar a nova conduta ao conjunto do cuidado do paciente, evitando fragmentação e duplicidade terapêutica. Essa é a definição operacional de coordenação do cuidado dentro dos atributos da APS.", "porque_correta": "Coordenação do cuidado é o atributo que garante que as informações provenientes de diferentes pontos da rede sejam integradas pela APS, que atua como referência central no acompanhamento do percurso do paciente entre os serviços.", "erros": {"A": "Incorreta porque o caso não trata da rapidez do atendimento inicial (acesso), mas sim do que a equipe faz depois do retorno do paciente de outro serviço, integrando as informações recebidas.", "B": "Incorreta porque territorialização refere-se ao processo de conhecer e organizar o cuidado a partir das características do território adscrito, e não à proximidade física entre paciente e unidade nesse episódio específico.", "D": "Incorreta porque equidade envolve ofertar respostas proporcionais à necessidade de cada pessoa para reduzir desigualdades, conceito distinto de integrar informações entre diferentes pontos da rede de atenção."}}, {"id": 4, "tema": "APS — Integralidade", "enunciado": "Uma paciente de 28 anos procura a UBS por dor lombar. Durante a consulta, o médico identifica que ela está com o calendário vacinal atrasado e sem rastreio de câncer de colo do útero há mais de três anos. Qual conduta melhor expressa o atributo da integralidade nesse caso?", "alternativas": {"A": "Tratar apenas a dor lombar e registrar as lacunas preventivas para uma consulta futura exclusiva sobre prevenção", "B": "Encaminhar a paciente à ginecologia e à sala de vacina antes de tratar a queixa principal", "C": "Registrar apenas a queixa principal, pois abordar temas não relatados espontaneamente pode ser invasivo", "D": "Abordar a dor lombar e também as lacunas preventivas na mesma consulta, sempre que viável, sem burocratizar em encaminhamentos desnecessários"}, "correta": "D", "raciocinio": "Integralidade significa considerar, na mesma linha de cuidado, promoção, prevenção, diagnóstico, tratamento e reabilitação — não apenas o motivo declarado da consulta. O raciocínio correto é aproveitar a oportunidade do contato já estabelecido para resolver tanto a queixa quanto as lacunas identificadas, de forma prática e sem fragmentar o cuidado em encaminhamentos desnecessários.", "porque_correta": "A conduta que mais expressa integralidade é aquela que amplia o olhar sobre a pessoa além da queixa principal, resolvendo o que for possível na própria consulta (vacinação, coleta de citopatológico) sem adiar desnecessariamente nem fragmentar o cuidado em múltiplos encaminhamentos evitáveis.", "erros": {"A": "Incorreta porque adiar as ações preventivas identificadas para uma consulta futura desperdiça a oportunidade já criada pelo contato presente, além de gerar risco de a paciente não retornar exclusivamente para isso — reduz a integralidade do cuidado prestado.", "B": "Incorreta porque fragmentar o cuidado em múltiplos encaminhamentos para resolver algo que poderia ser feito na própria UBS (vacinação, coleta de citopatológico) não é necessário e pode até atrasar o atendimento da queixa principal que motivou a busca pelo serviço.", "C": "Incorreta porque integralidade justamente pressupõe que a equipe amplie o olhar para além da queixa relatada espontaneamente; deixar de abordar lacunas preventivas identificadas durante o exame não é evitar invasão, mas sim negligenciar oportunidade de cuidado."}}, {"id": 5, "tema": "APS — Acesso oportuno e acolhimento", "enunciado": "Um paciente procura a UBS sem agendamento prévio, referindo febre e falta de ar iniciadas há um dia. A recepção informa que a próxima vaga disponível na agenda é em três semanas. Qual conduta é mais compatível com o princípio de acesso oportuno da APS?", "alternativas": {"A": "Realizar acolhimento com escuta qualificada e avaliação de risco/necessidade, organizando resposta compatível com a urgência do quadro, mesmo sem agendamento prévio", "B": "Manter a orientação da agenda, marcando a consulta programada em três semanas", "C": "Orientar o paciente a procurar diretamente um pronto-socorro, já que a UBS só trabalha com agenda programada", "D": "Sugerir que retorne no dia seguinte, quando talvez haja vaga disponível"}, "correta": "A", "raciocinio": "O ponto central do caso é reconhecer que acesso na APS não se resume a horário de agenda: é preciso organizar a resposta do serviço de acordo com a necessidade real do usuário. Diante de sintomas agudos e potencialmente graves (febre e dispneia), a resposta adequada é o acolhimento imediato com avaliação de risco, não a simples remissão à agenda programada.", "porque_correta": "Acesso oportuno significa organizar a resposta do serviço de forma compatível com a necessidade clínica apresentada, o que exige acolhimento e classificação de risco/necessidade mesmo para quem chega sem agendamento prévio, evitando reduzir o acesso apenas à lógica de marcação de consultas.", "erros": {"B": "Incorreta porque manter rigidamente a agenda programada, diante de sintomas agudos como febre e falta de ar, ignora a necessidade de resposta compatível com a urgência do quadro, indo contra o princípio de acesso oportuno.", "C": "Incorreta porque a UBS, como porta de entrada preferencial, deve acolher também necessidades agudas — encaminhar automaticamente ao pronto-socorro sem qualquer avaliação prévia transfere uma responsabilidade que cabe primeiro à própria unidade.", "D": "Incorreta porque adiar a avaliação para o dia seguinte, sem qualquer triagem no momento presente, pode ser inadequado diante de sintomas que podem indicar necessidade de atenção mais imediata, como falta de ar."}}, {"id": 6, "tema": "PNAB — Equipe e carga horária na eSF", "enunciado": "Buscando ampliar a cobertura territorial sem contratar novos profissionais, um gestor propõe que o médico de uma equipe de Saúde da Família divida sua carga horária entre duas equipes distintas, atendendo meio período em cada uma. Avalie essa proposta considerando os princípios de organização da eSF.", "alternativas": {"A": "A proposta é adequada, pois amplia a cobertura territorial sem custo adicional", "B": "A proposta é inadequada, pois compromete o vínculo e a longitudinalidade, já que a organização da eSF pressupõe equipe com carga horária dedicada a um território definido", "C": "A proposta é adequada, desde que o número total de consultas mensais seja mantido", "D": "A proposta é adequada apenas se o enfermeiro assumir a coordenação nos períodos de ausência do médico"}, "correta": "B", "raciocinio": "É preciso relacionar a forma de organização da equipe (carga horária, vínculo a um território definido) com os atributos que ela sustenta — sobretudo vínculo e longitudinalidade. Dividir a carga horária de um profissional entre duas equipes fragiliza justamente essa base organizacional, mesmo que o volume total de atendimentos pareça preservado.", "porque_correta": "A organização da eSF pressupõe equipe multiprofissional com carga horária dedicada a um território e população definidos, o que sustenta vínculo, acesso e longitudinalidade. Fragmentar a carga horária de um profissional entre equipes compromete essa estrutura, mesmo que o total de consultas seja mantido.", "erros": {"A": "Incorreta porque ampliar cobertura territorial não pode ser feita à custa da fragmentação do vínculo do profissional com um território e uma população definidos — isso compromete a base da organização da eSF, mesmo sem custo financeiro adicional.", "C": "Incorreta porque manter o número total de consultas não resolve o problema estrutural: o vínculo, a longitudinalidade e a coordenação dependem de continuidade e dedicação a um território específico, não apenas de volume de atendimentos.", "D": "Incorreta porque a substituição temporária de coordenação pelo enfermeiro não resolve o problema de fundo, que é a fragmentação da carga horária do médico entre dois territórios distintos, comprometendo a organização da equipe como um todo."}}, {"id": 7, "tema": "Financiamento da Atenção Básica", "enunciado": "Em uma discussão sobre organização do SUS, um estudante afirma: 'Como a Atenção Primária responde por grande parte dos atendimentos do sistema, é ela quem recebe, proporcionalmente, a maior parcela dos recursos financeiros do SUS.' Avalie essa afirmação.", "alternativas": {"A": "A afirmação está correta, pois maior volume de atendimentos corresponde proporcionalmente a maior financiamento", "B": "A afirmação está correta apenas em municípios de pequeno porte, onde a lógica de financiamento seria distinta", "C": "A afirmação está incorreta: historicamente, a Atenção Básica não recebe a maior parte do financiamento do SUS, que prioriza outros níveis de atenção", "D": "A afirmação está incorreta porque a Atenção Básica não realiza atendimentos, apenas encaminha para outros níveis"}, "correta": "C", "raciocinio": "É preciso separar dois dados: o volume de atendimentos realizados pela APS (proporcionalmente alto) e a proporção do financiamento do SUS destinada a ela (historicamente menor que a destinada a outros níveis, como a atenção hospitalar e especializada). A afirmação do estudante presume uma relação direta entre volume de atendimento e volume de financiamento que não se confirma na organização histórica do sistema.", "porque_correta": "Embora a Atenção Básica responda por parcela expressiva dos atendimentos do sistema, isso não se traduz, historicamente, em receber a maior parte do financiamento do SUS, que tende a priorizar outros níveis de atenção — uma desproporção frequentemente discutida na organização do sistema.", "erros": {"A": "Incorreta porque presume uma correspondência automática entre volume de atendimento e volume de financiamento que não reflete a distribuição histórica de recursos do SUS entre os níveis de atenção.", "B": "Incorreta porque a desproporção entre volume de atendimento e financiamento da Atenção Básica não é um fenômeno restrito a municípios pequenos, mas uma característica mais ampla da organização do financiamento do sistema.", "D": "Incorreta porque a Atenção Básica de fato realiza a maior parte dos atendimentos do sistema, sendo porta de entrada preferencial; o equívoco da afirmação original está na relação com o financiamento, não no fato de ela realizar atendimentos."}}, {"id": 8, "tema": "Planejamento territorial em saúde", "enunciado": "Uma equipe de Saúde da Família utiliza, para o planejamento anual, apenas o mapa territorial elaborado no momento da implantação da unidade, há cinco anos, sem atualizar o cadastro territorial ou revisar os dados da população. Avalie essa prática.", "alternativas": {"A": "A prática é adequada, pois o mapa territorial não muda de forma relevante ao longo dos anos", "B": "A prática é inadequada apenas se a população total do território tiver diminuído", "C": "A prática é adequada, desde que a equipe de profissionais continue a mesma desde a implantação", "D": "A prática é inadequada: o planejamento deve utilizar dados atuais, cadastro territorial atualizado e avaliação contínua, já que a dinâmica populacional e as vulnerabilidades mudam com o tempo"}, "correta": "D", "raciocinio": "O ponto central é entender que territorialização é um processo dinâmico e contínuo, não um retrato estático produzido uma única vez. Um planejamento baseado em dados de cinco anos atrás ignora possíveis mudanças relevantes na composição populacional, nas vulnerabilidades e nas necessidades do território.", "porque_correta": "O planejamento territorial deve se basear em dados atuais, cadastro territorial atualizado e avaliação contínua, pois a dinâmica populacional, migratória e social do território muda ao longo do tempo — um mapa estático de cinco anos atrás não reflete necessariamente a realidade presente.", "erros": {"A": "Incorreta porque territórios vivos mudam: migração, novas construções, alterações de vulnerabilidade e composição populacional podem ser significativas em cinco anos, tornando o mapa antigo pouco representativo da realidade atual.", "B": "Incorreta porque a inadequação da prática não depende apenas da variação numérica da população total; mudanças qualitativas nas vulnerabilidades e nas necessidades do território também tornam o planejamento desatualizado inadequado.", "C": "Incorreta porque a permanência da mesma equipe de profissionais não substitui a necessidade de atualização formal dos dados territoriais — mesmo profissionais experientes precisam de dados atuais para embasar o planejamento."}}, {"id": 9, "tema": "Modalidades de equipe e parâmetros normativos", "enunciado": "Um gestor aplica, para todas as modalidades de equipe de Atenção Básica de seu município — incluindo equipes de Saúde da Família e equipes voltadas a populações específicas —, exatamente os mesmos parâmetros de cobertura populacional e composição, sem qualquer distinção. Avalie essa conduta.", "alternativas": {"A": "É inadequada: diferentes modalidades de equipe têm parâmetros normativos próprios, que não devem ser tratados como equivalentes", "B": "É adequada, pois a PNAB padroniza igualmente todas as modalidades de equipe, sem exceções", "C": "É adequada, desde que o número de agentes comunitários seja o mesmo em todas as equipes", "D": "É inadequada apenas para equipes que atuam em áreas rurais, mas correta para as demais"}, "correta": "A", "raciocinio": "É necessário reconhecer que a Atenção Básica organiza diferentes modalidades de equipe conforme as características da população e do território atendido, cada uma com parâmetros normativos próprios que se atualizam ao longo do tempo. Tratar todas como idênticas ignora essa diferenciação estrutural.", "porque_correta": "Diferentes modalidades de equipe de Atenção Básica possuem parâmetros normativos próprios de composição e cobertura, que devem ser distinguidos e atualizados conforme as normas vigentes — aplicar um único parâmetro a todas as modalidades desconsidera essa diferenciação necessária.", "erros": {"B": "Incorreta porque a organização da Atenção Básica reconhece diferentes modalidades de equipe, adaptadas a diferentes contextos populacionais e territoriais, e não uma padronização única e irrestrita para todas as situações.", "C": "Incorreta porque a adequação da conduta não depende apenas de igualar o número de agentes comunitários; os parâmetros normativos envolvem composição, carga horária e cobertura de forma mais ampla, específicos a cada modalidade.", "D": "Incorreta porque a necessidade de distinguir parâmetros normativos entre modalidades de equipe não se restringe a áreas rurais; aplica-se de forma geral sempre que existirem modalidades distintas em um mesmo município."}}, {"id": 10, "tema": "Conselho gestor e acesso de trabalhadores", "enunciado": "Em reunião do conselho gestor de uma UBS, um membro relata que parte da população, por trabalhar em horário comercial e retornar tarde para casa, tem dificuldade de acesso aos serviços e menor vínculo com a equipe. Qual conceito está mais diretamente relacionado a esse problema e qual seria uma resposta adequada?", "alternativas": {"A": "O problema é de integralidade; a resposta adequada é ampliar a oferta de especialidades na unidade", "B": "O problema envolve abrangência de acesso e continuidade do vínculo; equipe e conselho gestor podem propor ajustes de horário/estratégias de acesso para incluir esse grupo", "C": "O problema é de território; a resposta adequada é redefinir os limites geográficos da área adstrita", "D": "O problema é de coordenação; a resposta adequada é encaminhar esses usuários a um serviço especializado"}, "correta": "B", "raciocinio": "O relato indica que uma parcela específica da população, por questões de horário de trabalho, tem seu acesso limitado e, por consequência, seu vínculo longitudinal prejudicado. O papel do conselho gestor é justamente identificar essa lacuna e propor ajustes operacionais (como horários estendidos ou estratégias alternativas) que ampliem o acesso desse grupo.", "porque_correta": "O problema relatado envolve diretamente a abrangência do acesso (parte da população não consegue chegar à unidade nos horários disponíveis) e a continuidade do vínculo longitudinal; a resposta adequada envolve o próprio papel do conselho gestor de propor ajustes de organização do serviço para incluir esse grupo.", "erros": {"A": "Incorreta porque o problema descrito não é falta de amplitude de serviços ofertados (integralidade), mas sim dificuldade de horário para acessar os serviços já existentes; ampliar especialidades não resolve a questão do horário de acesso.", "C": "Incorreta porque redefinir os limites geográficos da área não resolveria um problema que é de horário de funcionamento e estratégia de acesso, não de delimitação territorial.", "D": "Incorreta porque o problema não envolve a integração de informações entre diferentes serviços (coordenação), mas sim a própria possibilidade de acesso ao serviço da APS dentro do horário disponível ao trabalhador."}}, {"id": 11, "tema": "Síntese dos atributos da APS", "enunciado": "Uma UBS acolhe bem as demandas agudas quando o paciente procura a unidade, mas não realiza busca ativa de faltosos crônicos, os encaminhamentos a especialistas não retornam com contrarreferência, e cada profissional tende a tratar apenas a queixa do dia, sem revisar o quadro preventivo do paciente. Quais atributos da APS estão comprometidos nessa situação, apesar do bom primeiro contato?", "alternativas": {"A": "Apenas o acesso está comprometido; os demais atributos permanecem preservados", "B": "Nenhum atributo está comprometido, já que o acesso inicial é adequado", "C": "Longitudinalidade (ausência de busca ativa/vínculo continuado), coordenação (falta de contrarreferência) e integralidade (queixa tratada de forma isolada) estão comprometidas", "D": "Apenas a integralidade está comprometida, pois acesso e coordenação dependem exclusivamente dos especialistas"}, "correta": "C", "raciocinio": "É preciso analisar separadamente cada elemento do caso: a ausência de busca ativa de faltosos crônicos compromete a longitudinalidade (vínculo continuado); a falta de retorno de contrarreferência compromete a coordenação; e o hábito de tratar apenas a queixa pontual, sem revisão preventiva, compromete a integralidade. O bom primeiro contato não garante, por si só, que os demais atributos estejam preservados.", "porque_correta": "O caso apresenta três falhas distintas e simultâneas: falta de vínculo continuado (longitudinalidade), falta de integração de informações entre a UBS e o especialista (coordenação) e abordagem fragmentada da pessoa (integralidade) — mesmo que o acesso inicial (primeiro contato) esteja preservado.", "erros": {"A": "Incorreta porque, além do acesso, o caso descreve claramente falhas de longitudinalidade (ausência de busca ativa), coordenação (falta de contrarreferência) e integralidade (queixa tratada isoladamente) — não apenas de acesso, que inclusive está descrito como adequado.", "B": "Incorreta porque o bom primeiro contato (acesso) não implica que os demais atributos estejam preservados; o caso descreve explicitamente falhas de longitudinalidade, coordenação e integralidade, independentemente do acesso ser adequado.", "D": "Incorreta porque tanto o acesso quanto a coordenação são atributos que dependem primariamente da própria organização da APS, e não exclusivamente dos especialistas; a coordenação, inclusive, é justamente a responsabilidade da APS de integrar as informações vindas de outros serviços."}}, {"id": 12, "tema": "Territorialização — território vivo", "enunciado": "Um gestor resume o conceito de território, para fins de planejamento, apenas como 'a linha no mapa que delimita a área de abrangência da equipe', desconsiderando fluxos de trabalho, moradia e cultura da população. Avalie essa definição.", "alternativas": {"A": "A definição está correta, pois território é essencialmente um limite administrativo fixo", "B": "A definição está correta apenas em áreas rurais, onde os limites são mais estáveis", "C": "A definição é irrelevante para o planejamento em saúde, que deve se basear apenas em indicadores epidemiológicos", "D": "A definição está incompleta: o território é 'vivo' e inclui circulação, trabalho, moradia, cultura e acesso da população, não apenas o limite geográfico formal"}, "correta": "D", "raciocinio": "É preciso diferenciar o conceito administrativo de território (limite no mapa) do conceito de território vivo usado na Saúde da Família, que incorpora dinâmicas sociais como circulação de pessoas, relações de trabalho, moradia e cultura. Reduzir o território a uma linha no mapa ignora exatamente esses elementos dinâmicos.", "porque_correta": "O território, no contexto da APS, é entendido como espaço vivo, que vai além do limite geográfico formal e incorpora a circulação, o trabalho, a moradia, a cultura e o acesso da população — elementos essenciais para o diagnóstico e o planejamento do cuidado.", "erros": {"A": "Incorreta porque reduzir o território a um limite administrativo fixo ignora justamente as dinâmicas sociais, culturais e de circulação que caracterizam o território como espaço vivo, essenciais para compreender as necessidades da população.", "B": "Incorreta porque a necessidade de considerar circulação, trabalho, moradia e cultura da população não se restringe a áreas rurais — aplica-se também, e frequentemente de forma ainda mais complexa, a territórios urbanos.", "C": "Incorreta porque o conceito de território é central, e não irrelevante, para o planejamento em saúde: indicadores epidemiológicos isolados não substituem a compreensão da dinâmica social e cultural do território."}}, {"id": 13, "tema": "Diagnóstico situacional do território", "enunciado": "Para elaborar o diagnóstico de saúde do território, um profissional propõe utilizar exclusivamente os dados já registrados nos sistemas de informação da atenção básica, sem conversar com lideranças comunitárias ou observar diretamente o território. Avalie essa proposta.", "alternativas": {"A": "A proposta é insuficiente: o diagnóstico territorial deve combinar dados epidemiológicos, escuta comunitária e observação direta do território", "B": "A proposta é suficiente, pois os sistemas de informação já refletem toda a realidade do território", "C": "A proposta é insuficiente, mas apenas em territórios exclusivamente rurais, sendo suficiente nos demais", "D": "A proposta é suficiente, desde que os dados sejam atualizados mensalmente"}, "correta": "A", "raciocinio": "O raciocínio exige reconhecer os limites dos sistemas de informação em saúde: eles capturam dados estruturados (atendimentos, cadastros, indicadores), mas não captam aspectos qualitativos como percepções da comunidade, dinâmicas sociais informais e particularidades culturais, que só são acessíveis por meio de escuta e observação direta.", "porque_correta": "Um diagnóstico territorial completo deve combinar três fontes complementares: dados epidemiológicos/de sistemas de informação, escuta comunitária e observação direta do território — cada uma capta uma dimensão diferente da realidade local que as outras não alcançam sozinhas.", "erros": {"B": "Incorreta porque sistemas de informação em saúde registram dados estruturados (atendimentos, cadastros), mas não captam dimensões qualitativas como percepções da comunidade, conflitos sociais e particularidades culturais do território.", "C": "Incorreta porque a limitação dos sistemas de informação em captar a complexidade social e cultural do território não é exclusiva de áreas rurais — aplica-se igualmente, e muitas vezes de forma ainda mais intensa, a territórios urbanos complexos.", "D": "Incorreta porque a frequência de atualização dos dados não resolve o problema de fundo: mesmo dados atualizados mensalmente continuam sendo apenas uma fonte parcial, que precisa ser complementada por escuta comunitária e observação direta."}}, {"id": 14, "tema": "Equidade x igualdade no cuidado", "enunciado": "Uma equipe de Saúde da Família organiza o número de visitas domiciliares mensais de forma idêntica para todas as famílias da área, independentemente de haver idosos acamados, crianças com desnutrição ou nenhum fator de risco identificado. Avalie essa organização.", "alternativas": {"A": "Nenhum princípio está sendo violado, pois tratar todas as famílias de forma igual é sempre o mais correto", "B": "O princípio da equidade está sendo negligenciado; famílias com maior necessidade deveriam receber acompanhamento mais intenso, de forma proporcional", "C": "O princípio da universalidade está sendo violado; a equipe deveria reduzir as visitas às famílias sem fatores de risco", "D": "O princípio da territorialização está sendo violado, pois as visitas deveriam seguir ordem alfabética"}, "correta": "B", "raciocinio": "É necessário diferenciar igualdade (tratar todos da mesma forma) de equidade (oferecer respostas proporcionais à necessidade de cada um). Distribuir o mesmo número de visitas para famílias com necessidades muito diferentes ignora justamente o princípio da proporcionalidade que sustenta a equidade em saúde.", "porque_correta": "Equidade significa que respostas podem e devem ser diferenciadas conforme a necessidade, para reduzir desigualdades injustas; famílias com maior vulnerabilidade (idosos acamados, crianças desnutridas) deveriam receber acompanhamento proporcionalmente mais intenso, o que não ocorre na organização descrita.", "erros": {"A": "Incorreta porque tratar todas as famílias de forma idêntica, independentemente de sua necessidade, é exatamente o oposto do princípio de equidade, que pressupõe intensidade de cuidado proporcional à necessidade de cada família.", "C": "Incorreta porque universalidade se refere ao direito de todas as pessoas ao cuidado, não sendo violada por uma distribuição igualitária de visitas; o problema descrito é de proporcionalidade (equidade), não de garantia de acesso universal.", "D": "Incorreta porque o problema descrito não envolve os limites geográficos do território, mas sim a distribuição da intensidade de cuidado conforme a necessidade de cada família — questão de equidade, não de territorialização."}}, {"id": 15, "tema": "Vulnerabilidade — evitar estigmatização", "enunciado": "Buscando priorizar o atendimento, um profissional sugere afixar na recepção uma lista visível identificando 'famílias vulneráveis', para que sejam atendidas com prioridade. Com o tempo, a lista passa a expor publicamente essas famílias diante dos demais usuários. Avalie essa estratégia.", "alternativas": {"A": "Não há problema, pois identificar vulnerabilidade é sempre positivo, independentemente da forma de registro", "B": "A prioridade deveria ser abolida, atendendo todos rigorosamente por ordem de chegada", "C": "A identificação de vulnerabilidade deve orientar a oferta de cuidado internamente à equipe, de forma sigilosa, sem se tornar um rótulo público que gere estigma", "D": "A lista deveria ser exposta a toda a comunidade, garantindo maior transparência do processo"}, "correta": "C", "raciocinio": "O objetivo de identificar vulnerabilidade é orientar a oferta de cuidado e apoio — mas isso deve ocorrer de forma sigilosa, internamente à equipe. Quando a identificação se transforma em exposição pública, ela passa a gerar estigma, o que contraria justamente o princípio de que vulnerabilidade não deve virar rótulo ou barreira.", "porque_correta": "A vulnerabilidade deve orientar a oferta de cuidado e apoio de forma interna e sigilosa à equipe, evitando que a identificação se transforme em rótulo público, o que gera estigma e pode até afastar as famílias do serviço, em vez de aproximá-las do cuidado necessário.", "erros": {"A": "Incorreta porque a forma de registro importa muito: identificar vulnerabilidade de maneira pública e exposta gera estigma e pode prejudicar a relação de confiança entre a família e a equipe, mesmo que a intenção inicial fosse positiva.", "B": "Incorreta porque abolir totalmente a priorização de famílias mais vulneráveis contraria o princípio de equidade, que justamente prevê maior intensidade de cuidado para quem tem maior necessidade — o problema não é priorizar, mas expor publicamente.", "D": "Incorreta porque expor a lista a toda a comunidade amplia, em vez de reduzir, o problema de estigmatização das famílias identificadas, sendo o oposto do cuidado ético esperado no manejo dessa informação."}}, {"id": 16, "tema": "Vulnerabilidade — situação de rua e busca ativa", "enunciado": "Uma pessoa em situação de rua há vários anos apresenta lesões de pele hipoestésicas e tosse crônica, mas raramente procura os serviços de saúde por conta própria. Um agente comunitário identifica a situação durante atividade de rotina no território. Qual é a conduta mais adequada da equipe?", "alternativas": {"A": "A equipe deve aguardar que a pessoa procure espontaneamente a unidade, respeitando integralmente sua autonomia", "B": "A equipe deve encaminhar diretamente para internação hospitalar, independentemente de qualquer avaliação clínica prévia", "C": "A equipe não deve atuar até que a pessoa apresente documentação civil regularizada", "D": "A equipe deve realizar busca ativa e abordagem no território, investigando as queixas (possível hanseníase e tuberculose), já que populações em vulnerabilidade acentuada frequentemente têm menor acesso espontâneo aos serviços"}, "correta": "D", "raciocinio": "O caso reúne dois achados clínicos de relevância epidemiológica em população em situação de rua (lesões hipoestésicas sugestivas de hanseníase e tosse crônica sugestiva de tuberculose) com um padrão de baixo acesso espontâneo ao serviço. A conduta correta combina o reconhecimento da vulnerabilidade com uma resposta proativa da equipe, e não a espera passiva.", "porque_correta": "Populações em vulnerabilidade acentuada, como pessoas em situação de rua, frequentemente têm menor acesso espontâneo aos serviços de saúde; por isso, a equipe deve adotar estratégias proativas, como busca ativa e abordagem no território, para investigar adequadamente as queixas apresentadas.", "erros": {"A": "Incorreta porque, diante de uma população com baixo acesso espontâneo aos serviços e sinais clínicos relevantes, aguardar passivamente pode significar atraso importante no diagnóstico e tratamento de condições como hanseníase e tuberculose, com impacto individual e coletivo (risco de transmissão).", "B": "Incorreta porque encaminhar diretamente para internação hospitalar sem qualquer avaliação clínica prévia é desproporcional e não corresponde ao fluxo adequado de investigação diagnóstica, que deve começar pela avaliação e investigação no território ou na unidade.", "C": "Incorreta porque exigir documentação civil regularizada como pré-condição para atuação da equipe de saúde contraria o princípio de acesso universal ao cuidado, sobretudo para populações em situação de maior vulnerabilidade social."}}, {"id": 17, "tema": "Priorização em território de alta densidade populacional", "enunciado": "Uma médica assume um território de favela muito populoso, o que torna inviável o acompanhamento individualizado imediato de toda a população sob sua responsabilidade. Qual estratégia é mais adequada?", "alternativas": {"A": "A equipe deve priorizar grupos com maior vulnerabilidade — crianças pequenas, gestantes e idosos —, organizando agenda por estratificação de risco", "B": "A equipe deve atender estritamente por ordem de chegada, sem qualquer forma de priorização clínica", "C": "A equipe deve recusar-se a atender até que seja ampliada pela gestão municipal", "D": "A equipe deve reduzir o número de consultas diárias até que a população do território diminua"}, "correta": "A", "raciocinio": "Diante de uma limitação operacional real (grande volume populacional para uma única equipe), o raciocínio correto não é a inação nem a recusa, mas a organização do cuidado por estratificação de risco, priorizando grupos historicamente mais vulneráveis a agravos (crianças pequenas, gestantes, idosos), sem deixar de atender o restante da população ao longo do tempo.", "porque_correta": "Diante de população muito numerosa para acompanhamento individualizado imediato, a estratégia tecnicamente adequada é organizar o cuidado por estratificação de risco e prioridade, concentrando esforços inicialmente nos grupos de maior vulnerabilidade, sem abandonar o restante da população.", "erros": {"B": "Incorreta porque atender estritamente por ordem de chegada, sem qualquer priorização, ignora o princípio de equidade e pode deixar grupos de maior risco (crianças pequenas, gestantes, idosos) sem acompanhamento adequado e em tempo oportuno.", "C": "Incorreta porque recusar-se a atender até uma eventual ampliação da equipe abandona completamente a população do território, o que não é uma resposta aceitável do ponto de vista ético e assistencial, mesmo diante de limitações reais de recursos.", "D": "Incorreta porque reduzir o número de consultas diárias não resolve o problema de desproporção entre demanda e capacidade da equipe; pelo contrário, reduziria ainda mais o acesso da população ao cuidado necessário."}}, {"id": 18, "tema": "Ação intersetorial", "enunciado": "Uma equipe de Saúde da Família percebe um padrão de aumento de acidentes de trânsito envolvendo crianças em uma área com ruas sem sinalização adequada, próxima a uma escola. Qual conduta reflete melhor o princípio de ação intersetorial da APS?", "alternativas": {"A": "A equipe deve tratar apenas os casos clínicos que chegam à unidade, sem interferir em questões fora do setor saúde", "B": "A equipe deve articular com a escola, o setor de mobilidade urbana e lideranças locais, já que determinantes sociais como infraestrutura urbana raramente se resolvem apenas dentro da UBS", "C": "A equipe deve apenas emitir um relatório epidemiológico interno, sem contato com outros setores", "D": "A equipe deve aguardar que a Secretaria de Saúde tome a iniciativa isoladamente"}, "correta": "B", "raciocinio": "O caso descreve um problema cuja causa raiz (infraestrutura viária inadequada) está fora do alcance direto da equipe de saúde. O raciocínio correto reconhece que determinantes sociais como esse raramente se resolvem apenas com ações clínicas dentro da UBS, exigindo articulação com outros setores e atores do território.", "porque_correta": "Determinantes sociais complexos, como infraestrutura viária inadequada, raramente se resolvem apenas dentro da UBS; a ação intersetorial — envolvendo escola, setor de mobilidade urbana e lideranças locais — é a estratégia adequada para enfrentar esse tipo de problema de forma mais efetiva.", "erros": {"A": "Incorreta porque restringir a atuação da equipe apenas aos casos clínicos que chegam à unidade ignora o papel da APS na identificação e no enfrentamento de determinantes sociais de saúde presentes no território, que vão além do atendimento individual.", "C": "Incorreta porque produzir apenas um relatório interno, sem qualquer articulação com outros setores, não avança na resolução do problema identificado, que depende de ações fora do alcance exclusivo da equipe de saúde.", "D": "Incorreta porque aguardar passivamente uma iniciativa isolada da Secretaria de Saúde contraria o princípio de participação ativa da equipe local na construção de ações intersetoriais junto à comunidade e a outros setores do território."}}, {"id": 19, "tema": "Avaliação de impacto de ações intersetoriais", "enunciado": "Uma equipe realizou um mutirão de limpeza em parceria com moradores para reduzir criadouros de mosquito, mas não definiu indicadores, responsáveis ou uma forma de avaliar os resultados posteriormente. O que faltou tecnicamente no planejamento dessa ação?", "alternativas": {"A": "Nada faltou, pois a simples realização da ação já garante impacto positivo", "B": "Faltou apenas convidar mais moradores para participar do mutirão", "C": "Faltou definir objetivo, responsáveis, indicadores e revisão dos resultados, elementos necessários para avaliar o real impacto da ação intersetorial", "D": "Faltou solicitar autorização formal da vigilância sanitária antes de iniciar a ação"}, "correta": "C", "raciocinio": "Uma ação intersetorial bem planejada não se limita à execução da atividade em si; precisa incluir elementos de gestão que permitam avaliar seu impacto real: definição clara de objetivo, responsáveis por cada etapa, indicadores mensuráveis e um momento de revisão dos resultados obtidos. A ausência desses elementos compromete a capacidade da equipe de saber se a ação realmente funcionou.", "porque_correta": "Toda ação intersetorial, para ser avaliada quanto ao seu real impacto, precisa contemplar objetivo definido, responsáveis por cada etapa, indicadores de acompanhamento e um momento estruturado de revisão dos resultados — elementos que estavam ausentes no planejamento do mutirão descrito.", "erros": {"A": "Incorreta porque a realização de uma ação, por si só, não garante impacto positivo comprovável; sem indicadores e avaliação de resultados, a equipe não tem como saber se houve, de fato, redução relevante dos criadouros de mosquito.", "B": "Incorreta porque o problema central não é o número de participantes no mutirão, mas a ausência de estrutura de planejamento e avaliação (objetivo, responsáveis, indicadores, revisão de resultados) que permitiria mensurar o impacto da ação realizada.", "D": "Incorreta porque, embora a articulação com a vigilância sanitária possa ser útil em determinados contextos, o problema central apontado no caso é a ausência de elementos de planejamento e avaliação de impacto, não uma questão de autorização formal prévia."}}, {"id": 20, "tema": "Genograma — interpretação de símbolos", "enunciado": "No genograma de uma família, os símbolos quadrado (pai) e quadrado (filho) aparecem ligados por uma linha em zigue-zague, enquanto os símbolos dos pais estão ligados por uma linha dupla. Qual é a leitura correta desses elementos?", "alternativas": {"A": "A linha em zigue-zague indica proximidade entre pai e filho, e a linha dupla indica conflito conjugal", "B": "Os símbolos quadrados representam mulheres e os círculos representam homens, invertendo a leitura convencional", "C": "As linhas do genograma representam apenas grau de parentesco, sem qualquer informação sobre a qualidade da relação", "D": "A linha em zigue-zague entre pai e filho indica relação conflituosa, enquanto a linha dupla entre os pais indica um vínculo estreito/próximo"}, "correta": "D", "raciocinio": "O genograma utiliza uma notação padronizada em que o tipo de linha entre os símbolos comunica a qualidade do relacionamento, e não apenas o grau de parentesco. É preciso lembrar que a linha em zigue-zague convencionalmente representa conflito, enquanto a linha dupla representa uma relação de vínculo estreito — o oposto do que a alternativa A propõe.", "porque_correta": "Na notação convencional do genograma, o quadrado representa uma pessoa do sexo masculino, o círculo uma pessoa do sexo feminino, a linha em zigue-zague indica relação conflituosa entre os indivíduos conectados, e a linha dupla indica um vínculo próximo/estreito — exatamente a leitura descrita nesta alternativa.", "erros": {"A": "Incorreta porque inverte o significado das linhas: a linha em zigue-zague representa conflito (não proximidade), e a linha dupla representa vínculo estreito (não conflito conjugal) — a leitura está trocada.", "B": "Incorreta porque, na notação convencional do genograma, o quadrado representa pessoa do sexo masculino e o círculo representa pessoa do sexo feminino; a alternativa propõe justamente a inversão dessa convenção.", "C": "Incorreta porque um dos principais valores do genograma é justamente comunicar a qualidade das relações familiares (proximidade, conflito, ruptura) através de diferentes tipos de linha, e não apenas indicar o grau de parentesco entre os membros."}}, {"id": 21, "tema": "Genograma x ecomapa — funções distintas", "enunciado": "A equipe deseja compreender rapidamente se uma família tem apoio de vizinhos, igreja e serviços de assistência social, além de mapear a estrutura de parentesco da família ao longo de gerações. Qual instrumento é mais adequado para cada finalidade?", "alternativas": {"A": "O genograma representa a estrutura e relações familiares ao longo de gerações, enquanto o ecomapa mostra as conexões da família com serviços e recursos comunitários; para apoio externo, o ecomapa é o instrumento mais adequado", "B": "O genograma é mais adequado para mapear a rede de apoio externo, e o ecomapa para a estrutura familiar interna", "C": "Ambos os instrumentos têm exatamente a mesma função, podendo ser usados de forma intercambiável", "D": "Nenhum dos dois instrumentos é útil para essa finalidade, sendo necessária entrevista estruturada separada"}, "correta": "A", "raciocinio": "É preciso diferenciar claramente o objeto de cada instrumento: o genograma foca na estrutura e nas relações internas da família ao longo de gerações; o ecomapa foca nas conexões da família com o ambiente externo (serviços, grupos, comunidade). Para responder sobre apoio de vizinhos, igreja e assistência social, o instrumento correto é o ecomapa.", "porque_correta": "O genograma representa a estrutura e as relações familiares intergeracionais, enquanto o ecomapa mostra especificamente as conexões da família com sistemas externos — serviços, grupos e recursos comunitários —, sendo por isso o instrumento adequado para mapear apoio de vizinhos, igreja e assistência social.", "erros": {"B": "Incorreta porque inverte as funções dos instrumentos: o genograma é o que mapeia a estrutura familiar interna (parentesco, gerações), e o ecomapa é o que mapeia a rede de apoio externo — exatamente o oposto do proposto na alternativa.", "C": "Incorreta porque, embora complementares, os dois instrumentos têm focos distintos: um trata da estrutura familiar interna e outro das conexões externas da família, não sendo, portanto, intercambiáveis.", "D": "Incorreta porque tanto o genograma quanto o ecomapa são instrumentos amplamente utilizados e reconhecidos na abordagem familiar em MFC exatamente para esses fins, sem necessidade de substituí-los por outro método."}}, {"id": 22, "tema": "Ecomapa — leitura de lacunas de suporte", "enunciado": "O ecomapa de uma família mostra apenas uma linha tracejada e fina conectando a família ao serviço de saúde, sem nenhuma conexão com escola, trabalho ou grupos comunitários, apesar de a família ter filhos em idade escolar e um adulto em busca de emprego. Qual é a leitura clínica mais adequada?", "alternativas": {"A": "A família possui rede de apoio robusta e não necessita de qualquer intervenção adicional", "B": "O ecomapa sugere rede de apoio frágil e possíveis lacunas de suporte, o que deve orientar o plano de cuidado para fortalecer essas conexões", "C": "A ausência de linhas indica apenas falha do profissional ao desenhar, sem significado clínico relevante", "D": "O ecomapa deve ser refeito, pois toda família tem obrigatoriamente conexões fortes com escola e trabalho"}, "correta": "B", "raciocinio": "É necessário interpretar o ecomapa como um retrato da rede de apoio real da família: uma única linha tênue com o serviço de saúde e ausência de conexões com escola e trabalho (apesar de haver filhos em idade escolar e um adulto buscando emprego) sinaliza uma lacuna relevante de suporte, que deve ser incorporada ao plano de cuidado, e não ignorada.", "porque_correta": "A leitura do ecomapa deve considerar tanto a presença quanto a ausência de conexões: neste caso, a falta de vínculo com escola e trabalho, somada a um vínculo tênue com a saúde, sugere rede de apoio frágil, o que deve orientar a equipe a atuar no fortalecimento dessas conexões.", "erros": {"A": "Incorreta porque o próprio ecomapa descrito mostra o oposto de uma rede robusta: apenas uma conexão tênue com a saúde e nenhuma conexão com escola ou trabalho, apesar de haver necessidade identificada (filhos em idade escolar, adulto buscando emprego).", "C": "Incorreta porque a ausência de linhas no ecomapa é justamente uma informação clínica relevante — indica falta de conexão da família com aquele sistema —, e não um mero erro de preenchimento sem significado.", "D": "Incorreta porque não existe uma obrigatoriedade de que toda família tenha conexões fortes com escola e trabalho representadas no ecomapa; a ausência dessas conexões, quando há necessidade identificada, é justamente um achado clínico a ser trabalhado, não um erro de preenchimento."}}, {"id": 23, "tema": "Uso clínico do genograma e ecomapa", "enunciado": "Um profissional preenche o genograma e o ecomapa de uma família baseando-se apenas em suposições sobre a composição familiar, sem perguntar diretamente aos membros presentes na consulta. Qual é o principal problema dessa conduta?", "alternativas": {"A": "Não há problema, pois os instrumentos servem justamente para que o profissional infira a estrutura familiar sem necessidade de perguntar", "B": "O problema é apenas o tempo gasto na atividade, que deveria ter sido maior", "C": "As ferramentas devem apoiar hipóteses e o planejamento do cuidado, mas não substituem a escuta ativa da família; construí-las por suposição pode gerar informações incorretas", "D": "O problema é usar os dois instrumentos ao mesmo tempo, quando apenas um já seria suficiente"}, "correta": "C", "raciocinio": "O raciocínio central é lembrar que genograma e ecomapa são ferramentas de apoio ao raciocínio clínico, construídas a partir da escuta ativa da família — e não instrumentos de inferência baseados em suposições do profissional. Presumir a composição familiar sem checagem direta compromete a confiabilidade das informações e, por consequência, o plano de cuidado baseado nelas.", "porque_correta": "O genograma e o ecomapa devem apoiar hipóteses e o planejamento do cuidado, mas não substituem a escuta ativa da família; construí-los com base em suposições, sem checagem direta com os membros presentes, pode gerar informações incorretas que comprometem a qualidade do cuidado planejado.", "erros": {"A": "Incorreta porque os instrumentos foram concebidos para representar de forma fiel a estrutura e as relações reais da família, obtidas por meio de escuta ativa — não para que o profissional infira essas informações a partir de suposições próprias.", "B": "Incorreta porque o problema central não é a duração da atividade, mas sim a fonte das informações registradas: construir os instrumentos por suposição, independentemente do tempo gasto, compromete a fidedignidade dos dados.", "D": "Incorreta porque genograma e ecomapa têm funções complementares e distintas (estrutura familiar interna e rede externa de apoio, respectivamente); o problema do caso não está no uso simultâneo dos dois instrumentos, mas na forma como foram preenchidos."}}, {"id": 24, "tema": "Aspectos éticos no registro do genograma", "enunciado": "Durante a construção do genograma, um membro da família revela informação sensível sobre um parente e pede que ela não seja registrada de forma explícita no prontuário compartilhado pela equipe. Qual conduta é mais adequada?", "alternativas": {"A": "A informação deve ser registrada exatamente como foi dita, pois o prontuário deve ser sempre completo e literal", "B": "A informação deve ser completamente ignorada, já que não pode ser registrada de nenhuma forma", "C": "A informação deve ser compartilhada apenas verbalmente entre os profissionais, sem qualquer registro, mesmo que isso comprometa a continuidade do cuidado", "D": "O pedido deve ser respeitado, buscando-se registrar a informação com consentimento e linguagem respeitosa, preservando a confiança da família e revisando o genograma com ela quando pertinente"}, "correta": "D", "raciocinio": "O caso exige equilibrar dois valores: a utilidade clínica da informação para o cuidado da família e o respeito ao pedido explícito de confidencialidade feito por um de seus membros. A conduta adequada busca um caminho intermediário — respeitar o pedido, adequando a forma de registro com consentimento e linguagem cuidadosa, sem descartar completamente a informação nem simplesmente ignorar o pedido da família.", "porque_correta": "O cuidado ético no registro do genograma envolve buscar consentimento e usar linguagem respeitosa, ajustando a forma de registro conforme o pedido da família, o que preserva a confiança no vínculo e permite revisar o instrumento com ela quando for apropriado — sem simplesmente ignorar a informação ou o pedido.", "erros": {"A": "Incorreta porque registrar a informação exatamente como foi dita, ignorando o pedido explícito de confidencialidade da família, desrespeita a autonomia e a confiança depositada na equipe, podendo até comprometer o vínculo terapêutico.", "B": "Incorreta porque ignorar completamente a informação pode comprometer a compreensão do contexto familiar necessária ao cuidado; o desafio ético não é descartar a informação, mas encontrar uma forma adequada e respeitosa de lidar com ela.", "C": "Incorreta porque restringir a informação apenas à comunicação verbal entre profissionais, sem qualquer registro formal, pode comprometer a continuidade do cuidado por outros membros da equipe ao longo do tempo, além de não resolver adequadamente a questão ética envolvida."}}, {"id": 25, "tema": "Saúde mental — avaliação inicial de piora depressiva", "enunciado": "Um paciente já acompanhado por quadro depressivo leve retorna à UBS relatando piora dos sintomas há três semanas, com maior prejuízo funcional e alterações do sono e do apetite. Qual deve ser o primeiro passo da equipe?", "alternativas": {"A": "Caracterizar novamente os sintomas atuais (duração, intensidade, prejuízo funcional, sono) e avaliar segurança antes de qualquer ajuste terapêutico", "B": "Aumentar empiricamente a dose de qualquer medicação em uso, sem nova avaliação clínica", "C": "Encaminhar diretamente para internação psiquiátrica, apenas pela piora relatada, sem nova avaliação", "D": "Suspender o acompanhamento na APS, transferindo o caso integralmente ao CAPS"}, "correta": "A", "raciocinio": "Diante de qualquer relato de piora de quadro psíquico já acompanhado, o primeiro passo do raciocínio clínico não é a mudança automática de conduta, mas a reavaliação estruturada: caracterizar os sintomas atuais e, fundamentalmente, avaliar segurança (risco de autolesão ou suicídio) antes de decidir qualquer ajuste terapêutico, encaminhamento ou intensificação de tratamento.", "porque_correta": "Diante de piora relatada, o primeiro passo é sempre a reavaliação clínica estruturada — caracterizando sintomas atuais e avaliando segurança — antes de qualquer decisão terapêutica; pular essa etapa e partir direto para uma conduta específica é um erro de sequência no raciocínio clínico.", "erros": {"B": "Incorreta porque ajustar empiricamente a dose de medicação sem nova avaliação clínica ignora a necessidade de caracterizar a piora atual e avaliar segurança antes de qualquer intervenção terapêutica, podendo ser inadequado ou insuficiente conforme a real gravidade do quadro.", "C": "Incorreta porque encaminhar diretamente para internação, sem avaliação prévia estruturada, é uma conduta desproporcional diante apenas do relato de piora, sem que se tenha ainda caracterizado a gravidade real do quadro nem avaliado especificamente o risco.", "D": "Incorreta porque suspender o acompanhamento na APS e transferir integralmente o caso ao CAPS, sem avaliação prévia, contraria o princípio de que a APS pode acolher, avaliar e acompanhar quadros compatíveis com sua capacidade, articulando a rede apenas conforme a gravidade identificada."}}, {"id": 26, "tema": "Saúde mental — avaliação de risco suicida", "enunciado": "Durante a consulta, um paciente com sintomas depressivos comenta: 'às vezes penso que seria mais fácil não estar aqui.' Receoso de 'induzir a ideia', o profissional evita aprofundar o assunto e muda de tema. Avalie essa conduta.", "alternativas": {"A": "A conduta foi adequada, pois perguntar diretamente sobre suicídio pode induzir o comportamento", "B": "A conduta foi inadequada: é necessário investigar intenção, plano, meios e fatores protetores; perguntar diretamente não aumenta o risco", "C": "A conduta foi adequada, pois esse tipo de comentário costuma não ter relevância clínica", "D": "A conduta foi inadequada apenas por não ter sido registrada em prontuário, mas aprofundar o tema não era necessário"}, "correta": "B", "raciocinio": "O comentário do paciente é um sinal de alerta que exige investigação ativa, não evitação. É importante desconstruir a crença equivocada de que perguntar diretamente sobre ideação suicida aumenta o risco — na verdade, essa investigação é parte essencial da avaliação de segurança e não induz comportamento suicida.", "porque_correta": "Diante de qualquer sinal de ideação, mesmo indireto, é necessário investigar ativamente intenção, plano, meios disponíveis, tentativas prévias e fatores protetores; perguntar diretamente sobre o tema não aumenta o risco e é etapa essencial e obrigatória da avaliação de segurança em saúde mental.", "erros": {"A": "Incorreta porque essa é uma crença equivocada e amplamente desmentida na literatura: perguntar diretamente sobre ideação suicida não induz o comportamento; pelo contrário, evitar o tema pode deixar de identificar um risco real que precisa de manejo adequado.", "C": "Incorreta porque um comentário como esse, mesmo que indireto, é um sinal de alerta relevante que deve sempre ser investigado ativamente, e não descartado como algo sem relevância clínica.", "D": "Incorreta porque o problema não é apenas de registro em prontuário; a falha real está em não ter aprofundado a investigação sobre intenção, plano, meios e fatores protetores no momento em que o sinal de alerta foi verbalizado pelo paciente."}}, {"id": 27, "tema": "Saúde mental — diagnóstico diferencial em quadro depressivo", "enunciado": "Um paciente com quadro sugestivo de depressão relata, ao ser questionado, episódios anteriores de humor elevado, redução da necessidade de sono e aumento de energia com impulsividade — dados que não haviam sido investigados antes do início do antidepressivo. Por que essa investigação é importante?", "alternativas": {"A": "Essa investigação não é importante, pois todo quadro depressivo deve ser tratado da mesma forma", "B": "Essa investigação é importante apenas para fins de registro estatístico, sem impacto na conduta", "C": "Essa investigação é importante porque história de mania/hipomania, uso de substâncias e outras condições devem ser avaliadas como diagnóstico diferencial antes de definir o tratamento", "D": "Essa investigação é importante apenas quando o paciente é do sexo masculino"}, "correta": "C", "raciocinio": "Antes de tratar qualquer quadro depressivo, é necessário investigar diagnósticos diferenciais relevantes, entre eles história de episódios de humor elevado (mania/hipomania), uso de substâncias e outras condições clínicas ou medicamentosas. A presença desses dados no caso descrito é justamente o achado que deveria ter orientado uma investigação mais cuidadosa antes da decisão terapêutica inicial.", "porque_correta": "A investigação de história de mania/hipomania, uso de substâncias, condições clínicas e medicamentos é etapa essencial do diagnóstico diferencial em quadros depressivos, pois pode mudar significativamente a abordagem terapêutica indicada — daí a importância de não iniciar tratamento sem essa avaliação prévia.", "erros": {"A": "Incorreta porque quadros depressivos não devem ser tratados de forma padronizada e idêntica; a história pessoal (incluindo possíveis episódios de humor elevado) é essencial para definir corretamente a abordagem terapêutica mais adequada a cada caso.", "B": "Incorreta porque a investigação de diagnóstico diferencial tem impacto direto na conduta terapêutica, e não se resume a uma finalidade estatística ou de registro documental sem repercussão clínica.", "D": "Incorreta porque a necessidade de investigar diagnóstico diferencial em quadros depressivos, incluindo história de mania/hipomania, se aplica a todos os pacientes, independentemente do sexo, sendo uma etapa universal da avaliação clínica adequada."}}, {"id": 28, "tema": "Saúde mental — reconhecimento e conduta em quadro ansioso", "enunciado": "Um paciente relata insônia, preocupação excessiva com múltiplos aspectos da vida, tremores e sensação constante de medo, sem fator desencadeante claro, há vários meses. Qual é a conduta inicial mais adequada na APS?", "alternativas": {"A": "Iniciar apenas investigação laboratorial extensa para causas orgânicas, sem qualquer abordagem dos sintomas relatados", "B": "Orientar que o quadro não necessita de acompanhamento, pois preocupação é normal na vida adulta", "C": "Encaminhar imediatamente para internação, dado o risco de crise de ansiedade", "D": "Caracterizar o quadro ansioso, avaliar impacto funcional, afastar causas orgânicas relevantes e propor plano compartilhado com o paciente"}, "correta": "D", "raciocinio": "O quadro descrito (preocupação excessiva, insônia, tremor, medo persistente por vários meses) é compatível com um transtorno ansioso significativo. O raciocínio correto envolve caracterizar o quadro, avaliar seu impacto funcional, descartar causas orgânicas relevantes quando pertinente, e então construir um plano de cuidado compartilhado — sem banalizar os sintomas nem partir para condutas desproporcionais.", "porque_correta": "A conduta mais adequada combina caracterização clínica completa do quadro ansioso, avaliação de impacto funcional, investigação de causas orgânicas quando pertinente e construção de um plano compartilhado com o paciente, que pode incluir desde orientações e abordagens não farmacológicas até avaliação individualizada para intervenção medicamentosa.", "erros": {"A": "Incorreta porque investigar exclusivamente causas orgânicas, sem qualquer abordagem direta dos sintomas ansiosos relatados, deixa de lado a avaliação clínica do próprio quadro psíquico, que é central para definir o plano de cuidado.", "B": "Incorreta porque, embora preocupações pontuais sejam parte da vida adulta, o quadro descrito — persistente há vários meses, com múltiplos sintomas e sem fator desencadeante claro — ultrapassa o que seria considerado uma reação normal e exige avaliação e acompanhamento.", "C": "Incorreta porque o quadro descrito não apresenta, pelos dados fornecidos, sinais de risco agudo que justifiquem internação; essa é uma conduta desproporcional para um quadro ansioso crônico sem elementos de gravidade extrema relatados."}}, {"id": 29, "tema": "Saúde mental — anedonia e culpa: estratégia da equipe", "enunciado": "Um paciente relata culpa excessiva, falta de vontade de realizar atividade
