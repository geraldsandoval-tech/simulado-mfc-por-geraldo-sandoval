s que antes gostava e desânimo persistente há semanas, sem relato espontâneo de ideação suicida. Qual estratégia a equipe de Saúde da Família deve adotar?", "alternativas": {"A": "Reconhecer os sintomas como possível quadro depressivo, aprofundar a avaliação de segurança e organizar um plano de cuidado compartilhado", "B": "Orientar que 'isso passa com o tempo' e agendar retorno apenas se o paciente insistir", "C": "Encaminhar automaticamente para internação psiquiátrica, mesmo sem sinais de risco agudo", "D": "Não investigar mais a fundo, pois anedonia isolada não teria relevância clínica"}, "correta": "A", "raciocinio": "Os sintomas descritos (culpa excessiva, anedonia, desânimo persistente por semanas) formam um conjunto clinicamente relevante, compatível com quadro depressivo, mesmo sem relato espontâneo de ideação suicida — o que reforça a necessidade de investigação ativa de segurança como parte da avaliação, e não elimina a necessidade de manejo cuidadoso.", "porque_correta": "O conjunto de sintomas relatado deve ser reconhecido como possível quadro depressivo, com aprofundamento da avaliação (incluindo investigação ativa de segurança, mesmo sem relato espontâneo de ideação) e construção de plano de cuidado compartilhado, que pode incluir apoio psicossocial, abordagens não farmacológicas e seguimento programado.", "erros": {"B": "Incorreta porque minimizar os sintomas e não organizar seguimento estruturado deixa de reconhecer um quadro clinicamente relevante, adiando um cuidado que poderia evitar agravamento e prejuízo funcional adicional ao paciente.", "C": "Incorreta porque, na ausência de sinais de risco agudo, o encaminhamento automático para internação é desproporcional; a APS pode e deve acolher, avaliar e acompanhar esse tipo de quadro dentro de sua capacidade, articulando a rede apenas quando necessário.", "D": "Incorreta porque anedonia persistente associada a culpa excessiva e desânimo por várias semanas é um conjunto de sintomas clinicamente relevante, que exige investigação mais aprofundada, e não deve ser descartado como algo sem importância."}}, {"id": 30, "tema": "Saúde mental — psicoterapia no plano terapêutico", "enunciado": "Um paciente com transtorno depressivo leve a moderado é encaminhado apenas para uso de medicação, sem que outras abordagens terapêuticas sejam consideradas ou discutidas com ele. O que poderia ter sido acrescentado ao plano terapêutico?", "alternativas": {"A": "Nada poderia ter sido acrescentado, pois a medicação isolada é sempre suficiente e preferencial", "B": "A TCC e outras abordagens psicoterápicas estruturadas poderiam integrar o plano, conforme sintomas e preferências do paciente", "C": "Apenas internação hospitalar deveria ter sido considerada nesse caso", "D": "Nenhuma outra abordagem é validada para transtornos depressivos leves a moderados"}, "correta": "B", "raciocinio": "O plano terapêutico de transtornos depressivos deve ser construído de forma ampla, considerando não apenas a farmacoterapia, mas também abordagens psicoterápicas estruturadas, como a TCC, conforme sintomas, preferências e disponibilidade. Restringir o plano exclusivamente à medicação, sem discutir outras possibilidades com o paciente, é uma limitação do cuidado ofertado.", "porque_correta": "Abordagens psicoterápicas estruturadas, como a TCC, podem e devem integrar o plano terapêutico de transtornos depressivos leves a moderados, conforme os sintomas, as preferências do paciente e a disponibilidade de recursos — o cuidado não deve se restringir apenas à prescrição medicamentosa.", "erros": {"A": "Incorreta porque a medicação isolada não é necessariamente sempre suficiente ou preferencial; a decisão terapêutica deve ser individualizada e pode se beneficiar da combinação com abordagens psicoterápicas, conforme o caso.", "C": "Incorreta porque não há, no caso descrito, elementos que indiquem necessidade de internação hospitalar; trata-se de um quadro leve a moderado, cujo manejo ampliado envolve considerar psicoterapia, não hospitalização.", "D": "Incorreta porque abordagens psicoterápicas estruturadas, como a TCC, são reconhecidamente válidas e frequentemente recomendadas para transtornos depressivos leves a moderados, isoladamente ou em combinação com tratamento medicamentoso."}}, {"id": 31, "tema": "Saúde mental — individualização da decisão medicamentosa", "enunciado": "Dois pacientes com sintomas depressivos semelhantes procuram a unidade. Um médico decide prescrever exatamente a mesma medicação e dose para ambos, 'para simplificar', embora uma das pacientes esteja amamentando e o outro paciente já utilize outro fármaco com risco de interação. Avalie essa conduta.", "alternativas": {"A": "A conduta é adequada, pois padronizar a prescrição reduz erros de prescrição", "B": "A conduta é adequada, desde que a dose escolhida seja a mínima eficaz para ambos", "C": "A conduta é inadequada: a decisão sobre medicação deve ser individualizada, considerando riscos e interações medicamentosas de cada caso", "D": "A conduta só seria inadequada se algum dos pacientes já apresentasse efeito colateral"}, "correta": "C", "raciocinio": "O caso apresenta dois elementos concretos que exigem individualização da prescrição: amamentação (que pode restringir opções medicamentosas) e uso concomitante de fármaco com risco de interação. Ignorar essas diferenças em nome da 'simplicidade' representa um erro de raciocínio clínico que pode gerar dano evitável.", "porque_correta": "A decisão sobre medicação deve sempre ser individualizada, considerando sintomas, riscos, preferências do paciente, interações medicamentosas e necessidade de acompanhamento — exatamente os elementos que diferenciam os dois casos descritos (amamentação e risco de interação) e que tornam a prescrição idêntica inadequada.", "erros": {"A": "Incorreta porque padronizar a prescrição sem considerar diferenças clínicas relevantes entre os pacientes (como amamentação e risco de interação medicamentosa) não reduz erros — na verdade, aumenta o risco de dano evitável.", "B": "Incorreta porque a adequação da dose mínima eficaz não resolve o problema de fundo: mesmo em dose baixa, a medicação escolhida pode não ser apropriada para a paciente que amamenta ou pode interagir com o fármaco já usado pelo outro paciente.", "D": "Incorreta porque a decisão sobre a adequação da prescrição deve ser feita antes da ocorrência de qualquer efeito adverso, com base na avaliação prévia de riscos conhecidos (amamentação, interação medicamentosa), e não apenas reativamente após um dano já ocorrido."}}, {"id": 32, "tema": "Saúde mental — abordagem de hábitos sem culpabilização", "enunciado": "Um paciente com sintomas depressivos leves relata dificuldade para dormir e sedentarismo. O profissional afirma, de forma repreensiva, que 'a culpa é do paciente por não se esforçar o suficiente para mudar de vida.' Avalie essa abordagem.", "alternativas": {"A": "A abordagem foi adequada, pois responsabilizar o paciente tende a aumentar sua motivação", "B": "A abordagem foi inadequada apenas porque deveria ter sido registrada por escrito no prontuário", "C": "A abordagem foi adequada, mas deveria ter sido ainda mais enfática para surtir efeito", "D": "A abordagem foi inadequada por culpabilizar o paciente; o correto é abordar sono, atividade física, rotina e vínculos de forma acolhedora e colaborativa, sem culpabilização"}, "correta": "D", "raciocinio": "A abordagem de hábitos de vida (sono, atividade física, rotina) em quadros depressivos deve ser feita de forma acolhedora e colaborativa, reconhecendo que a própria condição depressiva frequentemente dificulta a mudança de hábitos. Atribuir a dificuldade exclusivamente a falta de esforço do paciente é uma culpabilização que contraria esse princípio e pode prejudicar o vínculo terapêutico.", "porque_correta": "A abordagem de hábitos e suporte em quadros depressivos deve ocorrer de forma acolhedora e colaborativa, sem culpabilização, reconhecendo que sono, atividade física e rotina são construídos junto ao paciente e não impostos como cobrança — a fala descrita no caso vai exatamente contra esse princípio.", "erros": {"A": "Incorreta porque culpabilizar o paciente tende a reduzir sua motivação e a piorar sentimentos já presentes de culpa e desvalia, característicos de quadros depressivos, em vez de auxiliar na mudança de hábitos.", "B": "Incorreta porque o problema central não é a ausência de registro escrito da fala, mas o próprio conteúdo culpabilizante da abordagem, que é inadequado independentemente de ser documentado ou não.", "C": "Incorreta porque intensificar uma abordagem culpabilizante pioraria, e não melhoraria, o problema identificado; o caminho correto é justamente o oposto — uma abordagem mais acolhedora e colaborativa, não mais enfática na cobrança."}}, {"id": 33, "tema": "Saúde mental — RAPS e nível de cuidado conforme gravidade", "enunciado": "Um paciente com transtorno mental comum, sem sinais de risco agudo, procura a UBS. Sem avaliação detalhada, a equipe já o encaminha automaticamente ao CAPS, 'para não errar'. Avalie essa conduta.", "alternativas": {"A": "A conduta não é necessariamente correta: a APS pode acolher, acompanhar e tratar quadros compatíveis com sua capacidade, e a articulação com o CAPS deve considerar gravidade e necessidade, não ser automática", "B": "A conduta é correta, pois todo caso de saúde mental deve ser manejado exclusivamente por serviços especializados", "C": "A conduta é correta, pois a APS nunca deve tratar questões relacionadas à saúde mental", "D": "A conduta é incorreta, pois nenhum caso deveria ser encaminhado ao CAPS, independentemente da gravidade"}, "correta": "A", "raciocinio": "O raciocínio correto reconhece que a APS tem capacidade e responsabilidade de acolher e tratar quadros de saúde mental compatíveis com sua complexidade, e que a articulação com o CAPS e a rede especializada deve ser proporcional à gravidade e à necessidade identificadas — não uma conduta automática 'por precaução', o que também sobrecarrega desnecessariamente a rede especializada.", "porque_correta": "A organização da rede de atenção psicossocial prevê que a APS acolha, acompanhe e trate quadros compatíveis com sua capacidade, articulando o cuidado com o CAPS e outros pontos da rede conforme gravidade, necessidade, território e disponibilidade — e não de forma automática para todo caso, independentemente de sua complexidade.", "erros": {"B": "Incorreta porque a APS tem papel ativo e reconhecido no manejo de transtornos mentais comuns, não sendo verdade que todo caso deva ser necessariamente manejado por serviços especializados como o CAPS.", "C": "Incorreta porque a saúde mental é parte constitutiva do cuidado prestado na APS, que deve realizar avaliação inicial, manejo de quadros compatíveis com sua capacidade e articulação com a rede quando necessário — não uma exclusão total do tema.", "D": "Incorreta porque o encaminhamento ao CAPS é adequado e necessário em determinadas situações, conforme gravidade e necessidade do caso; o problema apontado no enunciado não é o encaminhamento em si, mas sua realização de forma automática, sem avaliação prévia."}}, {"id": 34, "tema": "Política Nacional de Saúde Mental e organização da RAPS", "enunciado": "Durante uma discussão em equipe, um profissional afirma: 'A internação em hospital psiquiátrico deve ser sempre a primeira opção diante de qualquer transtorno mental, pois garante segurança total; CAPS e centros de convivência servem apenas como apoio complementar após a alta.' Avalie essa afirmação.", "alternativas": {"A": "A afirmação está correta, pois a hospitalização sempre reduz riscos de forma mais eficaz que outras estratégias", "B": "A afirmação está incorreta: a rede prioriza o cuidado em liberdade e a menor restrição necessária; a internação é indicada conforme o caso, não uma hierarquia fixa", "C": "A afirmação está correta apenas para pacientes sem qualquer rede de apoio familiar disponível", "D": "A afirmação está incorreta apenas porque centros de convivência não fariam parte da rede de saúde mental"}, "correta": "B", "raciocinio": "A afirmação analisada propõe uma hierarquia fixa e equivocada, colocando a internação como sempre a primeira opção. O raciocínio correto reconhece que a rede de atenção psicossocial é organizada de forma articulada, priorizando o cuidado em liberdade e a menor restrição necessária, com a internação reservada para quando clinicamente indicada — e não como ponto de partida universal.", "porque_correta": "A rede de atenção psicossocial prioriza o cuidado em liberdade e a menor restrição necessária; a internação deve ser considerada quando clinicamente indicada, não como primeira opção universal, e CAPS, centros de convivência e leitos hospitalares são componentes articulados de uma mesma rede, não uma hierarquia rígida com a internação no topo.", "erros": {"A": "Incorreta porque a hospitalização não é, por definição, sempre a estratégia mais eficaz ou segura; a rede de saúde mental prioriza formas de cuidado menos restritivas sempre que compatíveis com a segurança do paciente, reservando a internação para situações clinicamente indicadas.", "C": "Incorreta porque a adequação da internação como primeira opção não depende da existência de rede de apoio familiar; o princípio de priorizar o cuidado em liberdade e a menor restrição necessária se aplica de forma mais ampla, buscando fortalecer redes de apoio sempre que possível.", "D": "Incorreta porque o principal equívoco da afirmação original não está em excluir os centros de convivência da rede — eles de fato fazem parte dela —, mas em propor uma hierarquia fixa que coloca a internação como sempre a primeira opção."}}, {"id": 35, "tema": "Adolescência — consulta a sós e autonomia progressiva", "enunciado": "Uma adolescente de 15 anos comparece sozinha à UBS, relata início da vida sexual e solicita orientação sobre métodos contraceptivos, pedindo explicitamente que os pais não sejam informados. Qual é a conduta mais adequada?", "alternativas": {"A": "O atendimento deve ser recusado até que um responsável legal esteja presente, por se tratar de menor de idade", "B": "Os pais devem ser informados imediatamente, independentemente do desejo da adolescente, por se tratar de menor de 18 anos", "C": "A adolescente deve ser acolhida a sós, com orientação não julgadora sobre métodos contraceptivos e prevenção de IST, respeitando sua autonomia progressiva e o sigilo, salvo situações que exijam sua quebra para proteção dela mesma", "D": "A orientação deve ser apenas verbal, sem fornecimento de qualquer método, até que a adolescente complete 16 anos"}, "correta": "C", "raciocinio": "A atenção à saúde do adolescente pressupõe acolhimento a sós, com explicação dos limites do sigilo desde o início, e respeito à autonomia progressiva conforme maturidade e compreensão da adolescente. Diante de uma solicitação de orientação contraceptiva, sem sinais de risco que justifiquem quebra de sigilo, a conduta adequada é acolher, orientar e respeitar a confidencialidade solicitada.", "porque_correta": "A adolescente deve ser acolhida a sós, com orientação não julgadora sobre métodos contraceptivos disponíveis e prevenção de IST, respeitando sua autonomia progressiva e o sigilo da consulta — o sigilo só deve ser quebrado diante de risco relevante que justifique tal medida para proteção da própria adolescente.", "erros": {"A": "Incorreta porque recusar o atendimento até a presença de um responsável legal contraria o princípio de acolhimento a sós e autonomia progressiva na atenção à saúde do adolescente, podendo inclusive afastar a adolescente do serviço de saúde em um momento de busca por orientação importante.", "B": "Incorreta porque informar os pais de forma automática e sem que haja indicação de risco relevante contraria o princípio de sigilo na consulta do adolescente, que deve ser respeitado salvo diante de situações específicas que exijam sua quebra para proteção da adolescente.", "D": "Incorreta porque restringir a orientação a informações apenas verbais, sem fornecimento do método, com base unicamente na idade, contraria o princípio de autonomia progressiva e o direito à saúde sexual e reprodutiva já reconhecido para adolescentes nesse contexto."}}, {"id": 36, "tema": "Adolescência — limites do sigilo diante de risco", "enunciado": "Durante o acompanhamento, a mesma adolescente revela estar em um relacionamento no qual sofre agressões físicas frequentes por parte do parceiro. Como esse novo dado deve impactar a conduta quanto ao sigilo?", "alternativas": {"A": "O sigilo deve ser mantido de forma absoluta, independentemente do relato de violência", "B": "O sigilo só pode ser quebrado se a própria adolescente autorizar expressamente", "C": "A situação não modifica a conduta anterior, pois a queixa inicial sobre contracepção já havia sido resolvida", "D": "Diante de risco relevante à integridade da adolescente, o sigilo pode e deve ser quebrado, de forma explicada a ela, para viabilizar proteção adequada"}, "correta": "D", "raciocinio": "O novo dado (violência física frequente por parte do parceiro) muda substancialmente o cenário: passa a existir risco relevante à integridade da adolescente, o que justifica a quebra do sigilo, sempre de forma explicada a ela, para viabilizar as medidas de proteção necessárias — diferente da situação anterior, em que não havia elementos de risco.", "porque_correta": "Diante de risco relevante à integridade da adolescente, como no caso de violência física frequente, o sigilo pode e deve ser quebrado, sempre explicando à adolescente o motivo dessa decisão, para viabilizar a proteção adequada diante da situação identificada.", "erros": {"A": "Incorreta porque o princípio de proteção diante de risco relevante se sobrepõe à manutenção absoluta do sigilo; situações de violência que colocam a integridade da adolescente em risco justificam a quebra do sigilo, conforme previsto nos próprios limites dessa confidencialidade.", "B": "Incorreta porque, em situações de risco relevante, a quebra do sigilo pode ser necessária mesmo sem autorização expressa da adolescente, exatamente para viabilizar a proteção dela diante de uma situação que ela pode não conseguir resolver sozinha.", "C": "Incorreta porque o surgimento de um novo dado clínico relevante (violência física) deve necessariamente ser incorporado à condução do caso, não podendo ser desconsiderado apenas porque a queixa inicial (contracepção) já havia sido abordada em consulta anterior."}}, {"id": 37, "tema": "Adolescência — orientação não julgadora", "enunciado": "Ao atender outra adolescente com queixa semelhante, um profissional demonstra desaprovação verbal ('você é muito nova para isso') antes de fornecer qualquer orientação sobre saúde sexual. Qual é o problema dessa abordagem?", "alternativas": {"A": "A abordagem é inadequada: a orientação deve ser não julgadora, informando sobre métodos disponíveis e prevenção de IST, sem juízos de valor que possam afastar a adolescente do serviço", "B": "Não há problema, pois alertar sobre a idade é uma forma legítima de proteção", "C": "O problema está apenas no tom de voz utilizado, já que o conteúdo da frase está correto", "D": "A abordagem é adequada, desde que seja seguida de orientação técnica correta na sequência"}, "correta": "A", "raciocinio": "A atenção à saúde sexual do adolescente deve ser conduzida de forma não julgadora, com foco na orientação técnica e no vínculo de confiança. Um comentário de desaprovação, independentemente da orientação técnica que venha em seguida, compromete esse princípio e pode afastar a adolescente de buscar cuidado no futuro.", "porque_correta": "A orientação à saúde sexual do adolescente deve ser não julgadora, com foco em informação sobre métodos disponíveis e prevenção de IST; comentários de desaprovação comprometem o vínculo de confiança e podem afastar a adolescente do serviço, mesmo que a informação técnica seja correta.", "erros": {"B": "Incorreta porque um comentário de desaprovação verbal não constitui uma forma legítima ou eficaz de proteção; pelo contrário, pode afastar a adolescente do serviço de saúde, reduzindo o acesso a informações e cuidados importantes para sua proteção real.", "C": "Incorreta porque o problema não está apenas na forma (tom de voz), mas no próprio conteúdo da fala, que expressa julgamento moral sobre a vida sexual da adolescente — algo que contraria o princípio de orientação não julgadora, independentemente do tom utilizado.", "D": "Incorreta porque o dano ao vínculo de confiança causado pelo comentário de desaprovação inicial não é anulado por uma orientação técnica correta na sequência; o princípio de acolhimento não julgador deve permear toda a consulta, desde o início."}}, {"id": 38, "tema": "Adolescência — autonomia progressiva em decisões de saúde", "enunciado": "Um adolescente de 16 anos, com boa compreensão sobre sua condição de saúde crônica, deseja participar ativamente das decisões sobre seu tratamento, mas os pais preferem decidir por ele 'para não preocupá-lo'. Qual conduta é mais alinhada ao princípio da autonomia progressiva?", "alternativas": {"A": "A decisão deve caber sempre exclusivamente aos pais, independentemente da maturidade do adolescente", "B": "A maturidade, a compreensão e a participação do adolescente nas decisões devem ser consideradas, incluindo-o ativamente no processo, sem excluir o diálogo com a família", "C": "A decisão deve caber sempre exclusivamente ao adolescente, ignorando totalmente a opinião dos pais", "D": "Menores de 18 anos não devem participar de nenhuma decisão sobre o próprio tratamento"}, "correta": "B", "raciocinio": "O princípio de autonomia progressiva reconhece que a capacidade de participação do adolescente nas decisões sobre sua saúde aumenta conforme sua maturidade e compreensão — não sendo, portanto, nem uma exclusão total do adolescente nem uma exclusão total da família, mas uma inclusão equilibrada e proporcional à capacidade demonstrada.", "porque_correta": "A autonomia progressiva pressupõe considerar a maturidade, a compreensão e a participação do adolescente nas decisões sobre sua própria saúde, incluindo-o ativamente no processo decisório, sem que isso signifique excluir totalmente o diálogo com a família — um equilíbrio, e não um extremo.", "erros": {"A": "Incorreta porque desconsiderar totalmente a maturidade e a compreensão demonstradas pelo adolescente contraria diretamente o princípio de autonomia progressiva, que reconhece sua capacidade crescente de participar das decisões sobre a própria saúde.", "C": "Incorreta porque excluir totalmente a opinião da família também não representa o equilíbrio proposto pela autonomia progressiva, que busca incluir o adolescente no processo decisório sem necessariamente eliminar o diálogo familiar.", "D": "Incorreta porque a autonomia progressiva reconhece exatamente o oposto: que adolescentes, conforme sua maturidade e compreensão, devem ser incluídos nas decisões sobre o próprio tratamento, e não excluídos por completo apenas em razão da idade."}}, {"id": 39, "tema": "Desenvolvimento infantil — marcos aos 6 meses", "enunciado": "Uma mãe leva uma criança de 6 meses à consulta de puericultura de rotina. Ao exame, a criança sustenta bem a cabeça, rola do decúbito ventral para o dorsal e vice-versa, leva objetos à boca e emite sons de balbucio, mas ainda não senta sem apoio. Qual é a interpretação mais adequada?", "alternativas": {"A": "O desenvolvimento está atrasado, pois toda criança de 6 meses já deveria sentar sem apoio", "B": "É obrigatório encaminhamento imediato a neurologista, independentemente do restante do exame", "C": "O desenvolvimento é compatível com a faixa etária esperada aos 6 meses; sentar sem apoio costuma se consolidar um pouco mais adiante, e os demais marcos observados são adequados", "D": "A criança deveria estar andando com apoio nessa idade, o que indicaria atraso grave"}, "correta": "C", "raciocinio": "É necessário confrontar os marcos observados (controle cefálico, rolar em ambas as direções, levar objetos à boca, balbucio) com o que é esperado para a faixa etária de 6 meses, e reconhecer que sentar sem apoio é um marco que tipicamente se consolida um pouco mais à frente, não sendo, isoladamente, sinal de atraso nessa idade.", "porque_correta": "O conjunto de marcos observado (controle cefálico, rolar nas duas direções, levar objetos à boca, balbucio) é compatível com o desenvolvimento esperado aos 6 meses; a ausência de sentar sem apoio, isoladamente e nessa idade, não caracteriza atraso, pois esse marco costuma se consolidar em momento um pouco posterior.", "erros": {"A": "Incorreta porque sentar sem apoio de forma plena costuma se consolidar um pouco além dos 6 meses; exigir esse marco exatamente nessa idade, isoladamente, superestima o ritmo esperado de desenvolvimento típico.", "B": "Incorreta porque o conjunto de achados descritos é compatível com desenvolvimento típico para a idade, não havendo elementos no caso que justifiquem encaminhamento imediato e obrigatório a neurologista.", "D": "Incorreta porque andar com apoio é um marco esperado bem mais adiante no desenvolvimento motor (por volta do final do primeiro ano de vida), não sendo exigível de uma criança de 6 meses; cobrar esse marco nessa idade não tem respaldo no desenvolvimento típico."}}, {"id": 40, "tema": "Desenvolvimento infantil — avaliação de possível atraso", "enunciado": "Uma criança de 3 anos e 3 meses, sem comorbidades conhecidas, é trazida à UBS porque a mãe relata que ela fala poucas palavras, tem dificuldade de interação com outras crianças e ainda não corre com boa coordenação. Qual a conduta mais adequada?", "alternativas": {"A": "Tranquilizar a mãe sem qualquer avaliação estruturada, pois 'cada criança tem seu tempo'", "B": "Aguardar até os 5 anos para reavaliar, pois antes dessa idade não haveria intervenção possível", "C": "Encaminhar diretamente para internação, independentemente da gravidade do quadro relatado", "D": "Realizar avaliação estruturada do desenvolvimento, verificar sinais de alerta em múltiplos domínios e encaminhar para avaliação especializada"}, "correta": "D", "raciocinio": "A queixa envolve potencial atraso em múltiplos domínios do desenvolvimento (linguagem, interação social e coordenação motora) — um padrão que, segundo os próprios sinais de alerta discutidos na vigilância do desenvolvimento, justifica avaliação estruturada e encaminhamento para investigação especializada, sem demora desnecessária, já que a intervenção precoce é mais efetiva quanto antes iniciada.", "porque_correta": "Diante de queixas envolvendo múltiplos domínios do desenvolvimento, a conduta correta é realizar avaliação estruturada, identificar sinais de alerta e organizar encaminhamento para avaliação especializada e intervenção precoce quando indicado, sem aguardar desnecessariamente, pois a precocidade da intervenção está associada a melhores resultados.", "erros": {"A": "Incorreta porque tranquilizar a mãe sem qualquer avaliação estruturada, diante de uma queixa envolvendo múltiplos domínios do desenvolvimento (linguagem, interação social, coordenação motora), pode postergar uma intervenção precoce potencialmente benéfica para a criança.", "B": "Incorreta porque aguardar até os 5 anos contraria diretamente o princípio de intervenção precoce, que preconiza encaminhar e iniciar estímulos adequados assim que sinais de alerta são identificados, sem esperar desnecessariamente.", "C": "Incorreta porque não há, nos dados do caso, elementos que justifiquem uma internação; a conduta adequada envolve avaliação ambulatorial estruturada e encaminhamento especializado, não uma medida hospitalar desproporcional ao quadro descrito."}}, {"id": 41, "tema": "Vigilância do desenvolvimento — marcos como referência", "enunciado": "Ao notar que uma criança atingiu um marco de desenvolvimento poucas semanas após a média esperada, mas com evolução progressiva e sem outros sinais de alerta, um profissional já a classifica como portadora de 'atraso grave' e a encaminha com urgência máxima. Essa conduta está correta?", "alternativas": {"A": "Não necessariamente: os marcos são referências, com variação individual esperada; deve-se avaliar o conjunto de habilidades e a evolução", "B": "Sim, qualquer variação em relação à média já indica atraso grave que exige urgência máxima", "C": "Sim, pois toda criança deve atingir os marcos exatamente na média, sem qualquer variação", "D": "Não, porque marcos de desenvolvimento não teriam nenhuma utilidade clínica"}, "correta": "A", "raciocinio": "É necessário lembrar que os marcos de desenvolvimento são referências populacionais, e não pontos fixos que toda criança deve atingir exatamente na mesma semana. Uma pequena variação, associada a evolução progressiva e ausência de outros sinais de alerta, não caracteriza atraso grave — o raciocínio correto avalia o conjunto de habilidades e a trajetória, não um único marco isolado.", "porque_correta": "Os marcos de desenvolvimento são referências que admitem variação individual esperada; a avaliação clínica adequada considera o conjunto de habilidades, a evolução ao longo do tempo e o contexto da criança, não devendo classificar uma variação pontual e isolada, sem outros sinais de alerta, como atraso grave.", "erros": {"B": "Incorreta porque nem toda variação em relação à média representa atraso grave; a vigilância do desenvolvimento reconhece explicitamente a existência de variação individual esperada entre crianças com desenvolvimento típico.", "C": "Incorreta porque não existe expectativa realista de que toda criança atinja marcos exatamente na média populacional; alguma variação individual é esperada e normal dentro do desenvolvimento típico.", "D": "Incorreta porque os marcos de desenvolvimento têm, sim, grande utilidade clínica como referência para identificar sinais de alerta reais (como atraso em múltiplos domínios ou regressão), desde que interpretados corretamente, considerando o conjunto e não um ponto isolado."}}, {"id": 42, "tema": "Desenvolvimento infantil — sinais de alerta (regressão)", "enunciado": "Durante consultas seriadas de puericultura, uma criança que já falava frases curtas passa a não falar mais nenhuma palavra, além de apresentar perda de habilidades sociais que antes possuía. Como esse achado deve ser interpretado?", "alternativas": {"A": "Deve ser interpretado como variação normal do desenvolvimento, sem necessidade de investigação", "B": "Deve ser interpretado como sinal de alerta relevante — regressão de habilidades previamente adquiridas —, exigindo avaliação e encaminhamento para investigação especializada", "C": "Deve ser investigado apenas se a criança tiver mais de 5 anos de idade", "D": "Deve ser interpretado apenas como indicação de reforço escolar, sem necessidade de avaliação em saúde"}, "correta": "B", "raciocinio": "O elemento central deste caso é a perda de habilidades já adquiridas (linguagem e habilidades sociais), o que caracteriza regressão — um dos sinais de alerta mais relevantes na vigilância do desenvolvimento infantil, distinto de uma simples variação de ritmo, e que exige avaliação e investigação especializada sem demora.", "porque_correta": "A regressão de habilidades previamente adquiridas — como perda de linguagem já estabelecida e de habilidades sociais — é um sinal de alerta relevante na vigilância do desenvolvimento infantil, que exige avaliação e encaminhamento para investigação especializada, diferentemente de uma simples variação de ritmo entre marcos.", "erros": {"A": "Incorreta porque regressão de habilidades já adquiridas não é considerada variação normal do desenvolvimento; trata-se de um sinal de alerta específico e relevante, diferente da variação individual de ritmo entre crianças com desenvolvimento típico.", "C": "Incorreta porque a regressão de habilidades deve ser investigada assim que identificada, independentemente da idade da criança; não há justificativa para restringir a investigação apenas a crianças acima de determinada faixa etária.", "D": "Incorreta porque a regressão de habilidades de linguagem e sociais é um achado clínico relevante que exige avaliação em saúde e investigação especializada, e não pode ser reduzida a uma simples questão de reforço escolar."}}, {"id": 43, "tema": "Antropometria — escore-z e déficit nutricional", "enunciado": "Uma criança tem seu índice peso/idade avaliado, resultando em escore-z de -2,5, ou seja, 2,5 desvios-padrão abaixo da média da população de referência para idade e sexo. Qual é a interpretação correta desse achado?", "alternativas": {"A": "O valor está dentro da normalidade, pois pequenas variações abaixo da média são esperadas", "B": "Esse valor indica excesso de peso, e não déficit nutricional", "C": "Um escore-z abaixo de -2 desvios-padrão indica déficit nutricional, exigindo avaliação e intervenção adequadas", "D": "O escore-z só teria relevância clínica quando o valor fosse positivo, e não negativo"}, "correta": "C", "raciocinio": "É necessário aplicar corretamente o critério de interpretação do escore-z: valores abaixo de -2 desvios-padrão da média de referência indicam déficit nutricional. Como o caso apresenta um escore-z de -2,5 (abaixo do limiar de -2), o achado é compatível com déficit nutricional e exige avaliação e intervenção nutricional adequadas, não podendo ser interpretado como variação normal.", "porque_correta": "O critério de interpretação antropométrica estabelece que um escore-z abaixo de -2 desvios-padrão da média da população de referência para idade e sexo indica déficit nutricional; como o caso apresenta -2,5, o achado é compatível com déficit e exige avaliação e intervenção.", "erros": {"A": "Incorreta porque um escore-z de -2,5 ultrapassa o limiar de -2 desvios-padrão estabelecido como ponto de corte para déficit nutricional; não se trata, portanto, de uma pequena variação dentro da normalidade, mas de um achado que exige atenção clínica.", "B": "Incorreta porque um escore-z negativo indica valor abaixo da média de referência, e não excesso; excesso de peso seria representado por um escore-z positivo elevado, o oposto do que é descrito no caso.", "D": "Incorreta porque o escore-z é clinicamente relevante tanto em valores positivos (que podem indicar excesso de peso, conforme o índice avaliado) quanto em valores negativos abaixo do limiar de referência (que indicam déficit), como no caso descrito."}}, {"id": 44, "tema": "Antropometria — déficit crônico x agudo", "enunciado": "A criança 1 apresenta escore-z de peso/estatura normal, mas escore-z de estatura/idade abaixo de -2; a criança 2 apresenta escore-z de peso/estatura abaixo de -2, com estatura/idade normal. Qual é a interpretação mais adequada?", "alternativas": {"A": "Ambas as crianças apresentam exatamente o mesmo tipo de déficit nutricional", "B": "Nenhuma das duas crianças apresenta déficit nutricional, pois em cada caso pelo menos um índice está normal", "C": "A criança 2 tem déficit crônico e a criança 1 tem déficit agudo", "D": "A criança 1 apresenta padrão de déficit crônico (estatura/idade baixa); a criança 2, padrão de déficit agudo (peso/estatura baixo)"}, "correta": "D", "raciocinio": "É necessário associar corretamente cada índice antropométrico ao tipo de déficit que ele reflete: a estatura/idade comprometida reflete um processo mais prolongado (déficit crônico, ou retardo de crescimento linear), enquanto o peso/estatura comprometido reflete perda de massa mais recente (déficit agudo). Aplicando isso aos dois casos, a criança 1 (estatura/idade baixa) tem padrão de déficit crônico, e a criança 2 (peso/estatura baixo) tem padrão de déficit agudo.", "porque_correta": "A estatura/idade comprometida identifica déficit nutricional crônico (retardo de crescimento linear acumulado ao longo do tempo), enquanto o peso/estatura comprometido identifica déficit agudo (perda de massa mais recente); por isso, a criança 1 tem padrão crônico e a criança 2 tem padrão agudo — direcionando abordagens diferentes para cada caso.", "erros": {"A": "Incorreta porque os dois índices comprometidos são diferentes entre as crianças (estatura/idade na criança 1, peso/estatura na criança 2), refletindo tipos distintos de déficit nutricional — crônico e agudo, respectivamente — e não o mesmo padrão.", "B": "Incorreta porque um escore-z abaixo de -2 em qualquer um dos índices já indica déficit nutricional relevante naquele domínio específico, mesmo que outro índice esteja normal; não é necessário que todos os índices estejam alterados para caracterizar déficit.", "C": "Incorreta porque inverte a associação correta entre os índices e o tipo de déficit: é a criança 1 (estatura/idade baixa) que tem padrão de déficit crônico, e a criança 2 (peso/estatura baixo) que tem padrão de déficit agudo — o oposto do proposto na alternativa."}}, {"id": 45, "tema": "Cuidado intercultural — autonomia informada x abandono", "enunciado": "Uma equipe de saúde atende uma família indígena que utiliza práticas tradicionais de cuidado para uma criança com quadro febril persistente. Um profissional entende que 'respeitar a cultura' significa não abordar o caso de forma alguma, deixando a família decidir sozinha, sem qualquer diálogo ou informação sobre riscos. Essa interpretação está correta?", "alternativas": {"A": "Essa interpretação não está totalmente correta: respeitar a autonomia envolve informar riscos e alternativas de modo compreensível e apoiar uma decisão informada, sem impor condutas; a ausência total de diálogo pode comprometer a segurança sem, de fato, expressar respeito genuíno", "B": "Essa interpretação está correta: respeitar a cultura significa não intervir nem informar sobre riscos, deixando a família completamente livre", "C": "Essa interpretação está incorreta porque a equipe deveria impor a conduta biomédica, independentemente da vontade da família", "D": "Essa interpretação está correta, mas apenas para famílias indígenas; para as demais, a informação sobre riscos seria sempre obrigatória"}, "correta": "A", "raciocinio": "É preciso diferenciar respeito à autonomia de ausência total de cuidado. Respeitar a cultura e a autonomia da família não significa deixar de informar riscos e alternativas de forma compreensível; significa fazer isso sem impor condutas, apoiando uma decisão verdadeiramente informada — o que é diferente de simplesmente não dialogar.", "porque_correta": "O cuidado culturalmente seguro envolve informar riscos e alternativas de modo compreensível e apoiar a decisão informada da família, sem impor condutas — a ausência completa de diálogo, sob o pretexto de 'respeito', na verdade compromete a segurança clínica sem expressar respeito genuíno à autonomia, que pressupõe informação.", "erros": {"B": "Incorreta porque respeito à cultura não equivale a ausência de qualquer diálogo ou informação sobre riscos; a autonomia informada pressupõe que a família receba informações compreensíveis para poder decidir de forma genuinamente livre e consciente.", "C": "Incorreta porque impor a conduta biomédica independentemente da vontade da família também não é a abordagem adequada; o cuidado culturalmente seguro busca negociação e decisão compartilhada, não imposição em nenhuma das direções.", "D": "Incorreta porque o princípio de informar riscos e alternativas de modo compreensível para apoiar decisão informada se aplica a todas as famílias, não sendo um padrão exclusivo para famílias não indígenas nem dispensável para famílias indígenas."}}, {"id": 46, "tema": "Cuidado intercultural — negociação do plano de cuidado", "enunciado": "Uma família indígena aceita algumas orientações da equipe de saúde, mas deseja manter também práticas tradicionais de cuidado. Um profissional insiste que a família abandone completamente as práticas tradicionais, sob risco de 'não continuar o acompanhamento'. Qual é a conduta mais adequada?", "alternativas": {"A": "A suspensão total das práticas tradicionais deve ser imposta como condição para manter o acompanhamento", "B": "A equipe deve construir, junto à família, um plano de cuidado compartilhado que combine segurança clínica e respeito às práticas culturais", "C": "O acompanhamento da equipe de saúde deve ser suspenso definitivamente, transferindo toda a responsabilidade à família", "D": "As práticas tradicionais devem ser ignoradas no plano de cuidado, por serem consideradas irrelevantes"}, "correta": "B", "raciocinio": "O cuidado culturalmente seguro busca a construção compartilhada do plano de cuidado, combinando segurança clínica e respeito às práticas culturais da família, por meio de negociação — e não a imposição de condições excludentes que forcem a família a escolher entre o acompanhamento da equipe e suas práticas tradicionais.", "porque_correta": "A conduta adequada envolve negociar um plano de cuidado compartilhado com a família (e, quando desejado, com agentes tradicionais), combinando segurança clínica e respeito às práticas culturais, sem impor condições excludentes que forcem a família a abandonar completamente suas práticas para manter o acompanhamento.", "erros": {"A": "Incorreta porque impor a suspensão total das práticas tradicionais como condição para manter o acompanhamento contraria o princípio de negociação e construção compartilhada do plano de cuidado, além de poder afastar a família do serviço de saúde.", "C": "Incorreta porque suspender definitivamente o acompanhamento, diante de uma família que já aceita parte das orientações da equipe, representa abandono do cuidado, e não uma solução para o impasse relatado no caso.", "D": "Incorreta porque ignorar completamente as práticas tradicionais no plano de cuidado, tratando-as como irrelevantes, contraria o princípio de cuidado culturalmente seguro, que busca justamente incorporar e negociar essas práticas junto ao plano clínico."}}, {"id": 47, "tema": "Cuidado intercultural — segurança clínica sem coerção", "enunciado": "Uma equipe acompanha uma família indígena que optou por manter certas práticas tradicionais associadas ao cuidado de uma criança. A equipe deseja garantir segurança clínica sem desrespeitar a decisão da família. Qual estratégia é mais compatível com esse objetivo?", "alternativas": {"A": "A equipe deve acionar medidas para forçar a adesão exclusiva ao tratamento biomédico, independentemente do contexto", "B": "A equipe não deve estabelecer qualquer critério de acompanhamento, deixando toda a responsabilidade com a família", "C": "A equipe deve combinar com a família sinais de alarme que indiquem necessidade de reavaliação imediata, manter monitoramento acessível e garantir acesso oportuno, sem recorrer à coerção automática", "D": "A equipe deve recusar-se a atender a criança enquanto a família mantiver qualquer prática tradicional"}, "correta": "C", "raciocinio": "É preciso equilibrar dois objetivos aparentemente em tensão: garantir segurança clínica e respeitar a decisão da família. A estratégia que atinge ambos é combinar previamente sinais de alarme que exijam reavaliação, manter monitoramento acessível e garantir acesso oportuno ao serviço, sem recorrer à coerção — diferente tanto da imposição quanto do abandono total do acompanhamento.", "porque_correta": "A estratégia mais compatível com segurança clínica e respeito à decisão da família envolve combinar sinais de alarme que indiquem necessidade de reavaliação imediata, manter monitoramento acessível e garantir acesso oportuno ao serviço, sem recorrer à coerção automática — um equilíbrio entre cuidado e respeito à autonomia.", "erros": {"A": "Incorreta porque forçar a adesão exclusiva ao tratamento biomédico, independentemente do contexto, representa coerção, contrariando o princípio de cuidado culturalmente seguro sem coerção automática, que busca outras formas de garantir segurança.", "B": "Incorreta porque a ausência total de critérios de acompanhamento abandona a responsabilidade de monitoramento da equipe, que deve permanecer acessível e atenta a sinais de alarme, mesmo respeitando a decisão da família quanto às práticas tradicionais.", "D": "Incorreta porque recusar o atendimento enquanto a família mantiver qualquer prática tradicional é uma forma de coerção indireta que pode afastar a família do serviço de saúde, contrariando o princípio de acesso oportuno e cuidado culturalmente seguro."}}, {"id": 48, "tema": "Síntese — território, vulnerabilidade e abordagem familiar", "enunciado": "Uma família vive em território de alta vulnerabilidade social. O genograma mostra conflito entre um adolescente e o padrasto, e o ecomapa mostra isolamento, com poucas conexões externas. A equipe também percebe aumento de comorbidades crônicas na comunidade e identifica, na mesma família, uma adolescente buscando orientação contraceptiva. Qual abordagem reflete melhor a integração desses elementos?", "alternativas": {"A": "Cada demanda deve ser tratada isoladamente, em consultas totalmente independentes, sem qualquer conexão entre os achados", "B": "Toda a família deve ser encaminhada exclusivamente para acompanhamento hospitalar, dada a complexidade do caso", "C": "O contexto familiar e comunitário deve ser ignorado, focando-se apenas na queixa mais recente apresentada", "D": "O conhecimento do território, do genograma e do ecomapa deve ser integrado num plano de cuidado compartilhado, articulando a adolescente, as comorbidades e a rede de apoio"}, "correta": "D", "raciocinio": "O caso reúne múltiplos elementos que, isoladamente, já foram trabalhados em questões anteriores: vulnerabilidade territorial, leitura de genograma e ecomapa, comorbidades emergentes na comunidade e atenção à adolescente. O raciocínio de síntese exige reconhecer que esses elementos não são independentes, mas compõem um mesmo contexto familiar e territorial, que deve orientar um plano de cuidado integrado — e não abordagens fragmentadas ou desproporcionais.", "porque_correta": "A abordagem mais adequada integra o conhecimento do território, do genograma e do ecomapa para compreender o contexto completo da família, articulando de forma coordenada o cuidado à adolescente (com autonomia e sigilo preservados), a atenção às comorbidades emergentes na comunidade e o fortalecimento da rede de apoio da família, dentro de um plano de cuidado compartilhado e continuado — a essência do raciocínio integrado em MFC.", "erros": {"A": "Incorreta porque tratar cada demanda de forma totalmente isolada ignora justamente a riqueza do raciocínio em MFC, que busca compreender a pessoa e a família dentro de seu contexto territorial, familiar e comunitário, e não de forma fragmentada.", "B": "Incorreta porque não há, no caso descrito, elementos que indiquem necessidade de internação hospitalar para a família; trata-se de um conjunto de questões que podem e devem ser manejadas na própria APS, de forma integrada e continuada.", "C": "Incorreta porque ignorar o contexto familiar e comunitário contraria diretamente os princípios da abordagem familiar e territorial em MFC, que orientam justamente a considerar esses elementos para compreender e cuidar melhor da pessoa."}}, {"id": 49, "tema": "Síntese — saúde mental, adolescência e confidencialidade", "enunciado": "Uma adolescente de 15 anos, acompanhada por quadro de ansiedade e insônia, revela durante consulta a sós que iniciou vida sexual recentemente e teme conversar com os pais sobre o assunto; não relata ideação suicida nem outros sinais de risco imediato. Qual conduta integra corretamente os princípios envolvidos?", "alternativas": {"A": "O sigilo deve ser mantido, pois não há risco relevante que justifique sua quebra; o quadro ansioso deve ser acompanhado e a orientação sexual deve ser não julgadora", "B": "Os pais devem ser informados imediatamente sobre ambos os temas, independentemente da ausência de risco imediato", "C": "A adolescente deve ser encaminhada automaticamente ao CAPS, suspendendo qualquer abordagem na APS", "D": "A equipe deve recusar-se a discutir saúde sexual, concentrando-se exclusivamente no quadro ansioso"}, "correta": "A", "raciocinio": "O caso integra dois eixos: saúde mental (ansiedade/insônia, sem sinais de risco imediato) e saúde do adolescente (início de vida sexual, com pedido implícito de sigilo). Como não há elementos de risco relevante que justifiquem quebra de sigilo, a conduta correta mantém a confidencialidade, aborda tecnicamente os dois temas com orientação não julgadora, e reforça o vínculo, sem fragmentar o cuidado nem adotar condutas desproporcionais.", "porque_correta": "A conduta correta integra os princípios de manejo de saúde mental na APS (avaliação e acompanhamento do quadro ansioso, sem necessidade de encaminhamento automático) e de atenção à saúde do adolescente (sigilo mantido na ausência de risco relevante, orientação não julgadora sobre saúde sexual, respeito à autonomia progressiva) em um único plano coerente.", "erros": {"B": "Incorreta porque, na ausência de risco relevante que justifique a quebra de sigilo, informar os pais de forma automática contraria o princípio de confidencialidade na consulta do adolescente, que deve ser preservado nesse cenário.", "C": "Incorreta porque o quadro ansioso descrito, sem sinais de risco agudo, é compatível com o manejo dentro da capacidade da APS; encaminhar automaticamente ao CAPS e suspender o acompanhamento na APS não é proporcional à gravidade apresentada.", "D": "Incorreta porque recusar-se a discutir saúde sexual, tema trazido espontaneamente pela adolescente, contraria o princípio de acolhimento integral e orientação não julgadora que deve orientar a consulta, além de desperdiçar uma oportunidade importante de cuidado."}}, {"id": 50, "tema": "Síntese final — raciocínio integral de MFC", "enunciado": "Um paciente idoso, morador de área de alta vulnerabilidade, é atendido por queixa aguda, recebe orientação e prescrição, mas a equipe não define critérios claros de retorno, sinais de alerta a observar, nem forma de reavaliação do resultado do cuidado prestado. À luz do raciocínio de MFC (começar pela pessoa, ler o território, definir o plano e fechar o ciclo), o que está faltando?", "alternativas": {"A": "Nada está faltando, pois o atendimento agudo já foi resolvido com a prescrição", "B": "Falta fechar o ciclo do cuidado: combinar retorno, sinais de alerta, comunicação clara e avaliação dos resultados do cuidado prestado", "C": "Falta apenas repetir a prescrição em uma dose maior", "D": "Falta encaminhar automaticamente a um especialista, independentemente da necessidade"}, "correta": "B", "raciocinio": "O raciocínio de MFC descrito no material de revisão envolve quatro etapas: começar pela pessoa, ler o território, definir o plano e fechar o ciclo. O caso demonstra que as três primeiras etapas foram cumpridas (a queixa foi acolhida e um plano foi definido), mas a última etapa — fechar o ciclo, combinando retorno, sinais de alerta, comunicação e avaliação de resultados — não foi realizada, o que compromete a continuidade e a segurança do cuidado prestado.", "porque_correta": "O fechamento do ciclo de cuidado — combinando critérios claros de retorno, sinais de alerta a observar, comunicação clara com o paciente e uma forma de avaliar os resultados do cuidado prestado — é etapa essencial do raciocínio em MFC, e sua ausência compromete o seguimento adequado do paciente após o atendimento inicial, especialmente em contexto de vulnerabilidade.", "erros": {"A": "Incorreta porque resolver a prescrição da queixa aguda não equivale a completar todo o raciocínio de cuidado em MFC; sem critérios de retorno, sinais de alerta e avaliação de resultados, o ciclo do cuidado permanece incompleto, especialmente relevante em paciente idoso e em território vulnerável.", "C": "Incorreta porque o problema identificado no caso não é a dose da prescrição, mas a ausência de elementos de continuidade do cuidado (retorno, sinais de alerta, comunicação, avaliação de resultados); repetir a prescrição em dose maior não resolve essa lacuna.", "D": "Incorreta porque não há, nos dados do caso, indicação de que a queixa exija necessariamente avaliação especializada; o que falta é justamente estruturar o fechamento do ciclo de cuidado dentro da própria APS, não um encaminhamento automático e desnecessário."}}];

var TOTAL = QUESTIONS.length;
var STORAGE_KEY = "mfcRevisaoInterativa_v1";

var state = {
  screen: "start",         // start | quiz | result
  index: 0,                // current question index (into activeList)
  answers: {},              // questionId -> { selected, correct }
  reviewMode: false,
  reviewList: []            // array of question indices (into QUESTIONS) for wrong-answer review
};

function saveState() {
  try {
    var payload = {
      index: state.index,
      answers: state.answers,
      screen: state.screen,
      reviewMode: state.reviewMode,
      reviewList: state.reviewList
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (e) { /* storage unavailable — continue without persistence */ }
}

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    var parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object" || !parsed.answers) return null;
    return parsed;
  } catch (e) { return null; }
}

function clearState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

function answeredCount() {
  return Object.keys(state.answers).length;
}

function getActiveList() {
  return state.reviewMode ? state.reviewList : QUESTIONS.map(function (q, i) { return i; });
}

function currentQuestion() {
  var list = getActiveList();
  var qi = list[state.index];
  return QUESTIONS[qi];
}

function el(html) {
  var d = document.createElement("div");
  d.innerHTML = html.trim();
  return d.firstChild;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/* ---------------- START SCREEN ---------------- */

function renderStart() {
  var saved = loadState();
  var hasResume = saved && saved.answers && Object.keys(saved.answers).length > 0 && Object.keys(saved.answers).length < TOTAL && !saved.reviewMode;

  var resumeHtml = "";
  if (hasResume) {
    var doneCount = Object.keys(saved.answers).length;
    resumeHtml =
      '<div class="resume-banner">Você tem uma revisão em andamento — <strong>' + doneCount + '/' + TOTAL + '</strong> questões respondidas.</div>';
  }

  var actionsHtml = "";
  if (hasResume) {
    actionsHtml =
      '<div class="start-actions">' +
        '<button class="btn btn-primary" onclick="resumeSession()">Continuar revisão</button>' +
        '<button class="link-btn" onclick="startFresh()">Começar do zero</button>' +
      '</div>';
  } else {
    actionsHtml =
      '<div class="start-actions">' +
        '<button class="btn btn-primary" onclick="startFresh()">Iniciar revisão</button>' +
      '</div>';
  }

  var app = document.getElementById("app");
  app.innerHTML =
    '<div class="screen start-screen">' +
      '<div class="start-mark">MFC</div>' +
      '<h1 class="start-title">Revisão interativa</h1>' +
      '<p class="start-subtitle">' + TOTAL + ' questões — análise clínica e raciocínio</p>' +
      '<div class="start-stats">' +
        '<div class="start-stat"><div class="start-stat-num">' + TOTAL + '</div><div class="start-stat-label">questões inéditas</div></div>' +
        '<div class="start-stat"><div class="start-stat-num">8</div><div class="start-stat-label">áreas temáticas</div></div>' +
        '<div class="start-stat"><div class="start-stat-num">A–D</div><div class="start-stat-label">casos clínicos</div></div>' +
      '</div>' +
      resumeHtml +
      actionsHtml +
    '</div>';
}

function startFresh() {
  clearState();
  state = { screen: "quiz", index: 0, answers: {}, reviewMode: false, reviewList: [] };
  saveState();
  render();
}

function resumeSession() {
  var saved = loadState();
  if (!saved) { startFresh(); return; }
  state.screen = "quiz";
  state.index = saved.index || 0;
  state.answers = saved.answers || {};
  state.reviewMode = false;
  state.reviewList = [];
  render();
}

/* ---------------- QUIZ SCREEN ---------------- */

function renderQuiz() {
  var list = getActiveList();
  var q = currentQuestion();
  var position = state.index + 1;
  var listTotal = list.length;
  var percent = state.reviewMode ? Math.round((position / listTotal) * 100) : Math.round((position / TOTAL) * 100);
  var answer = state.answers[q.id];
  var answered = !!answer;

  var lettersOrder = ["A", "B", "C", "D"];

  var altsHtml = "";
  lettersOrder.forEach(function (letter) {
    var text = q.alternativas[letter];
    var classes = "alt-row";
    var mark = "";
    if (answered) {
      classes += " locked";
      if (letter === q.correta) {
        classes += " correct-row";
        mark = '<span class="alt-mark">✅</span>';
      } else if (letter === answer.selected) {
        classes += " incorrect-row";
        mark = '<span class="alt-mark">❌</span>';
      } else {
        classes += " dim";
      }
    }
    var clickAttr = answered ? "" : ' onclick="selectAnswer(\'' + letter + '\')"';
    altsHtml +=
      '<button class="' + classes + '"' + clickAttr + (answered ? " disabled" : "") + '>' +
        '<span class="alt-badge">' + letter + '</span>' +
        '<span class="alt-text">' + escapeHtml(text) + '</span>' +
        mark +
      '</button>';
  });

  var feedbackHtml = "";
  var explainHtml = "";
  if (answered) {
    if (answer.correct) {
      feedbackHtml = '<div class="feedback-banner is-correct">CORRETO ✅</div>';
    } else {
      feedbackHtml = '<div class="feedback-banner is-incorrect">INCORRETO ❌</div>';
    }

    var wrongLettersHtml = "";
    lettersOrder.filter(function (l) { return l !== q.correta; }).forEach(function (l) {
      wrongLettersHtml +=
        '<div class="wrong-alt-item"><span class="wrong-alt-letter">' + l + ')</span>' +
        '<span class="explain-text" style="display:inline">' + escapeHtml(q.erros[l]) + '</span></div>';
    });

    explainHtml =
      '<div class="explain-panel">' +
        '<div class="explain-block">' +
          '<div class="explain-label">Gabarito</div>' +
          '<div class="explain-gabarito">Alternativa ' + q.correta + '</div>' +
        '</div>' +
        '<div class="explain-block">' +
          '<div class="explain-label">Raciocínio</div>' +
          '<p class="explain-text">' + escapeHtml(q.raciocinio) + '</p>' +
        '</div>' +
        '<div class="explain-block">' +
          '<div class="explain-label">Por que a correta está correta</div>' +
          '<p class="explain-text">' + escapeHtml(q.porque_correta) + '</p>' +
        '</div>' +
        '<div class="explain-block">' +
          '<div class="explain-label">Por que as demais estão erradas</div>' +
          wrongLettersHtml +
        '</div>' +
      '</div>';
  }

  var isLastInList = state.index === listTotal - 1;
  var nextLabel = state.reviewMode
    ? (isLastInList ? "Voltar ao resultado" : "Próxima")
    : (isLastInList ? "Ver resultado" : "Próxima");

  var reviewFlagHtml = state.reviewMode ? '<span class="review-flag">Revisão de erros · ' + position + '/' + listTotal + '</span><br>' : "";

  var app = document.getElementById("app");
  app.innerHTML =
    '<div class="quiz-header">' +
      '<div class="quiz-header-row">' +
        '<span class="quiz-counter">Questão <b>' + position + '</b>/' + (state.reviewMode ? listTotal : TOTAL) + '</span>' +
        '<span class="quiz-percent">' + percent + '%</span>' +
      '</div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + percent + '%"></div></div>' +
    '</div>' +
    '<div class="quiz-body">' +
      reviewFlagHtml +
      '<div class="tema-chip">' + escapeHtml(q.tema) + '</div>' +
      '<p class="enunciado">' + escapeHtml(q.enunciado) + '</p>' +
      '<div class="alt-list">' + altsHtml + '</div>' +
      feedbackHtml +
      explainHtml +
    '</div>' +
    '<div class="quiz-nav">' +
      '<button class="btn btn-ghost" onclick="goPrev()" ' + (state.index === 0 ? "disabled" : "") + '>Anterior</button>' +
      '<button class="btn btn-primary" onclick="goNext()" ' + (answered ? "" : "disabled") + '>' + nextLabel + '</button>' +
    '</div>';

  window.scrollTo(0, app.scrollTop = 0);
  document.documentElement.scrollTop = 0;
}

function selectAnswer(letter) {
  var q = currentQuestion();
  if (state.answers[q.id]) return; // already locked
  var correct = letter === q.correta;
  state.answers[q.id] = { selected: letter, correct: correct };
  saveState();
  renderQuiz();
}

function goNext() {
  var list = getActiveList();
  var isLast = state.index === list.length - 1;
  if (isLast) {
    if (state.reviewMode) {
      state.screen = "result";
      state.reviewMode = false;
    } else {
      state.screen = "result";
    }
    saveState();
    render();
    return;
  }
  state.index += 1;
  saveState();
  render();
}

function goPrev() {
  if (state.index === 0) return;
  state.index -= 1;
  saveState();
  render();
}

/* ---------------- RESULT SCREEN ---------------- */

function computeScore() {
  var acertos = 0, erros = 0, wrongIdx = [];
  QUESTIONS.forEach(function (q, i) {
    var a = state.answers[q.id];
    if (a) {
      if (a.correct) acertos++; else { erros++; wrongIdx.push(i); }
    }
  });
  return { acertos: acertos, erros: erros, wrongIdx: wrongIdx };
}

function classify(percent) {
  if (percent >= 90) return { label: "Excelente domínio", desc: "Você demonstra domínio consistente dos conceitos e consegue aplicá-los com segurança em situações clínicas variadas." };
  if (percent >= 75) return { label: "Bom domínio", desc: "Sua base está sólida. Revise os pontos específicos em que errou para fechar as últimas lacunas de raciocínio." };
  if (percent >= 60) return { label: "Domínio parcial", desc: "Você já reconhece boa parte dos conceitos, mas ainda erra decisões-chave. Vale revisar os temas com mais erros antes da prova." };
  return { label: "Necessita revisão", desc: "Ainda há lacunas importantes de raciocínio. Reserve um tempo para revisar os temas com calma antes de tentar novamente." };
}

function renderResult() {
  var score = computeScore();
  var percent = Math.round((score.acertos / TOTAL) * 100);
  var band = classify(percent);

  var app = document.getElementById("app");
  app.innerHTML =
    '<div class="screen result-screen">' +
      '<div class="result-hero">' +
        '<div class="result-percent">' + percent + '%</div>' +
        '<div class="result-band">' + band.label + '</div>' +
        '<p class="result-band-desc">' + band.desc + '</p>' +
      '</div>' +
      '<div class="result-track"><div class="result-track-fill" style="width:' + percent + '%"></div></div>' +
      '<div class="result-stats">' +
        '<div class="result-stat-card acertos"><div class="result-stat-num">' + score.acertos + '</div><div class="result-stat-label">acertos</div></div>' +
        '<div class="result-stat-card erros"><div class="result-stat-num">' + score.erros + '</div><div class="result-stat-label">erros</div></div>' +
      '</div>' +
      '<div class="result-actions">' +
        (score.erros > 0 ? '<button class="btn btn-primary" onclick="startReview()">Revisar questões erradas</button>' : '') +
        '<button class="btn btn-ghost" onclick="startFresh()">Refazer revisão completa</button>' +
      '</div>' +
      (score.erros === 0 ? '<p class="review-tema-note">Você acertou todas as questões desta revisão.</p>' : '') +
    '</div>';
}

function startReview() {
  var score = computeScore();
  if (score.wrongIdx.length === 0) return;
  state.reviewMode = true;
  state.reviewList = score.wrongIdx;
  state.index = 0;
  state.screen = "quiz";
  saveState();
  render();
}

/* ---------------- ROUTER ---------------- */

function render() {
  if (state.screen === "start") renderStart();
  else if (state.screen === "quiz") renderQuiz();
  else if (state.screen === "result") renderResult();
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
}

render();
</script>
